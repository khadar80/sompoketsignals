// Forex furan: Isniinta 00:00 UTC ilaa Jimcaha 21:00 UTC
// Sessions: Sydney(21-06), Tokyo(00-09), London(07-16), NewYork(12-21)
function getForexStatus(){
  const now=new Date();
  const utcDay=now.getUTCDay(); // 0=Sun,1=Mon,...,6=Sat
  const utcH=now.getUTCHours();
  const utcM=now.getUTCMinutes();
  const utcTotal=utcH*60+utcM;

  // Weekend: Saturday after 21:00 UTC OR Sunday before 22:00 UTC
  const isWeekend=(utcDay===6&&utcTotal>=21*60)||(utcDay===0&&utcTotal<22*60)||utcDay===6&&utcTotal>=21*60;
  
  if(isWeekend){
    // Calculate when market reopens
    let minsToOpen;
    if(utcDay===6){minsToOpen=((7*24*60)-(utcTotal-21*60))%(7*24*60); minsToOpen=(24*60-utcTotal+21*60)+(24*60);}
    else{minsToOpen=(22*60)-utcTotal;}
    const h=Math.floor(Math.abs(minsToOpen)/60),m=Math.abs(minsToOpen)%60;
    return{open:false,session:"XIDHAN",reason:`Weekend · ${h}h ${m}m gudahood`,color:"#ff4d6a"};
  }

  // Active sessions
  const sessions=[];
  if(utcTotal>=0&&utcTotal<9*60)sessions.push("Tokyo");
  if(utcTotal>=21*60||utcTotal<6*60)sessions.push("Sydney");
  if(utcTotal>=7*60&&utcTotal<16*60)sessions.push("London");
  if(utcTotal>=12*60&&utcTotal<21*60)sessions.push("New York");

  // Best trading time: London+NY overlap (12:00-16:00 UTC)
  const isOverlap=utcTotal>=12*60&&utcTotal<16*60;
  const isLowLiq=sessions.length===0||(sessions.length===1&&sessions[0]==="Sydney");

  if(isLowLiq){
    return{open:true,session:"LOW LIQUIDITY",reason:"Sydney only · Signals weak",color:"#ffd60a",quality:"low"};
  }

  return{
    open:true,
    session:sessions.join(" + "),
    reason:isOverlap?"Overlap · Best signals":"Active session",
    color:isOverlap?"#00ff88":"#00b4d8",
    quality:isOverlap?"best":"good"
  };
}

// Fetch real current price from Finnhub
async function fetchRealPrice(symbol){
  try{
    const fhSym=FH_SYMBOL[symbol];
    if(!fhSym)return null;
    const r=await fetch(`https://finnhub.io/api/v1/quote?symbol=${encodeURIComponent(fhSym)}&token=${FINNHUB_KEY}`);
    const d=await r.json();
    if(d&&d.c&&d.c>0)return parseFloat(d.c);
    return null;
  }catch(e){return null;}
}

// Fetch real candle history from Finnhub for signal analysis
async function fetchCandles(symbol,resolution){
  try{
    const fhSym=FH_SYMBOL[symbol];
    if(!fhSym)return null;
    const to=Math.floor(Date.now()/1000);
    // Resolution mapping: Finnhub supports 1,5,15,30,60,D
    const resMap={"30s":"1","1m":"1","2m":"5","5m":"5","15m":"15"};
    const res=resMap[resolution]||"1";
    const from=to-(40*parseInt(res)*60); // enough candles
    const url=`https://finnhub.io/api/v1/forex/candle?symbol=${encodeURIComponent(fhSym)}&resolution=${res}&from=${from}&to=${to}&token=${FINNHUB_KEY}`;
    const r=await fetch(url);
    const d=await r.json();
    if(d&&d.s==="ok"&&d.c&&d.c.length>=10){
      return d.c.slice(-40); // last 40 close prices
    }
    return null;
  }catch(e){return null;}
}

function genPrice(p){return parseFloat((p+(Math.random()-0.495)*p*0.002).toFixed(5));}

function analyze(hist){
  const p=hist&&hist.length>=10?hist:Array.from({length:14},(_,i)=>1+i*0.001);
  const n=p.length;let g=0,l=0;
  for(let i=1;i<n;i++){const d=p[i]-p[i-1];d>0?g+=d:l+=Math.abs(d);}
  const rsi=100-100/(1+(g/n)/((l/n)||0.0001));
  const ema=(arr,k)=>arr.slice(-k).reduce((a,b,i)=>i===0?b:a*(1-2/(k+1))+b*(2/(k+1)),arr[0]);
  const e5=ema(p,5),e14=ema(p,14);
  const mean=p.reduce((a,b)=>a+b,0)/n;
  const std=Math.sqrt(p.reduce((a,b)=>a+Math.pow(b-mean,2),0)/n);
  const last=p[n-1];
  let up=0,dn=0;
  if(rsi<32)up+=3;else if(rsi<45)up+=1;
  if(rsi>68)dn+=3;else if(rsi>55)dn+=1;
  if(e5>e14)up+=2;else dn+=2;
  if(last<=mean-2*std)up+=3;else if(last>=mean+2*std)dn+=3;
  // NO random for real data — pure indicator based
  const dir=up>=dn?"UP":"DOWN";
  const score=Math.max(up,dn);
  const conf=Math.min(94,Math.floor(72+score*2.5));
  let strat="Multi-Indicator";
  if(rsi<32||rsi>68)strat="RSI Extreme Zone";
  else if(last<=mean-2*std||last>=mean+2*std)strat="Bollinger Reversal";
  else if(Math.abs(e5-e14)>std*0.3)strat="EMA Trend Cross";
  else if(up>dn+1)strat="Bullish Confluence";
  else if(dn>up+1)strat="Bearish Confluence";
  else strat="S/R Bounce";
  return{dir,conf,strat};
}

function analyzeOTC(hist){
  // OTC uses slight randomness since prices are fake anyway
  const base=analyze(hist);
  base.conf=Math.min(94,base.conf+Math.floor(Math.random()*6));
  return base;
}

function playBeep(up){
  try{
    const ctx=new(window.AudioContext||window.webkitAudioContext)();
    const osc=ctx.createOscillator(),gain=ctx.createGain();
    osc.connect(gain);gain.connect(ctx.destination);
    osc.frequency.value=up?880:440;osc.type="sine";
    gain.gain.setValueAtTime(0.3,ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.5);
    osc.start();osc.stop(ctx.currentTime+0.5);
  }catch(e){}
}

function MiniChart({data,color}){
  const W=68,H=30;
  if(!data||data.length<2)return React.createElement("svg",{width:W,height:H});
  const min=Math.min(...data),max=Math.max(...data),range=max-min||0.0001;
  const bw=Math.max(2,W/data.length-0.8);
  const bars=data.map((v,i)=>{
    const pv=i>0?data[i-1]:v,isUp=v>=pv;
    const x=(i/(data.length-1))*(W-bw);
    const yh=H-((Math.max(v,pv)-min)/range)*(H-4)-2;
    const yl=H-((Math.min(v,pv)-min)/range)*(H-4)-2;
    return React.createElement("rect",{key:i,x,y:yh,width:bw,height:Math.max(2,yl-yh),fill:isUp?"#00ff88":"#ff4d6a",opacity:0.8,rx:0.5});
  });
  const pts=data.map((v,i)=>`${(i/(data.length-1))*W},${H-((v-min)/range)*(H-4)-2}`).join(" ");
  return React.createElement("svg",{width:W,height:H},...bars,
    React.createElement("polyline",{points:pts,fill:"none",stroke:color,strokeWidth:"1",opacity:"0.5"})
  );
}

// Sync ring — shows real clock seconds aligned to timeframe
function SyncRing({tf,startTime}){
  const [now,setNow]=useState(Date.now());
  useEffect(()=>{
    const t=setInterval(()=>setNow(Date.now()),200);
    return()=>clearInterval(t);
  },[]);
  const tfSec=TF_SEC[tf]||60;
  // Align to real clock: e.g. 1m candles close at :00 each minute
  const elapsed=Math.floor((now-startTime)/1000);
  const remaining=tfSec-((elapsed)%tfSec);
  const pct=remaining/tfSec;
  const r=18,c=2*Math.PI*r;
  const col=pct>0.5?"#00ff88":pct>0.25?"#ffd60a":"#ff4d6a";
  const urgent=remaining<=5;
  return(
    <svg width={44} height={44}>
      <circle cx={22} cy={22} r={r} fill="none" stroke="rgba(255,255,255,0.07)" strokeWidth={3}/>
      <circle cx={22} cy={22} r={r} fill="none" stroke={col} strokeWidth={3}
        strokeDasharray={c} strokeDashoffset={c*(1-pct)} strokeLinecap="round"
        transform="rotate(-90 22 22)" style={{transition:"stroke-dashoffset 0.2s linear"}}/>
      <text x={22} y={26} textAnchor="middle" fill={col} fontSize={11} fontWeight="bold"
        fontFamily="monospace" style={{animation:urgent?"blink 0.5s infinite":"none"}}>{remaining}</text>
    </svg>
  );
}

          </div>
        )}

        {/* ── ACCURACY TAB ── */}
        {tab==="accuracy"&&(
          <div>
            <div style={{fontSize:8,color:sub,letterSpacing:2,marginBottom:10}}>SAWIRKA GUUSHA</div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:12}}>
              {[
                {l:"Guud ahaan",total:stats.wins+stats.losses,wins:stats.wins},
                {l:"XOOGGAN 88%+",total:allHist.filter(s=>s.conf>=88&&s.result).length,wins:allHist.filter(s=>s.conf>=88&&s.result==="WIN").length},
                {l:"OTC Signals",total:allHist.filter(s=>s.assetType==="otc"&&s.result).length,wins:allHist.filter(s=>s.assetType==="otc"&&s.result==="WIN").length},
                {l:"Forex Signals",total:allHist.filter(s=>s.assetType==="forex"&&s.result).length,wins:allHist.filter(s=>s.assetType==="forex"&&s.result==="WIN").length},
                {l:"BUY",total:allHist.filter(s=>s.dir==="UP"&&s.result).length,wins:allHist.filter(s=>s.dir==="UP"&&s.result==="WIN").length},
                {l:"SELL",total:allHist.filter(s=>s.dir==="DOWN"&&s.result).length,wins:allHist.filter(s=>s.dir==="DOWN"&&s.result==="WIN").length},
              ].map(row=>{
                const pct=row.total>0?Math.round(row.wins/row.total*100):0;
                const col=pct>=70?"#00ff88":pct>=55?"#ffd60a":"#ff4d6a";
                return(
                  <div key={row.l} style={{background:card,border:`1px solid ${bdr}`,borderRadius:10,padding:"11px 12px"}}>
                    <div style={{fontSize:9,color:sub,marginBottom:5}}>{row.l}</div>
                    <div style={{fontSize:26,fontWeight:900,color:col}}>{pct}%</div>
                    <div style={{fontSize:9,color:sub,marginTop:2}}>{row.wins}/{row.total}</div>
                    <div style={{marginTop:6,height:4,background:"rgba(255,255,255,0.07)",borderRadius:2,overflow:"hidden"}}>
                      <div style={{width:`${pct}%`,height:"100%",background:col,transition:"width 0.8s"}}/>
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
        )}

        {/* ── MARTINGALE TAB ── */}
        {tab==="martingale"&&(
          <div>
            <div style={{fontSize:8,color:sub,letterSpacing:2,marginBottom:12}}>MARTINGALE CALCULATOR</div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8,marginBottom:14}}>
              {[
                {l:"Lacagta 1aad ($)",val:mgBase,set:setMgBase,min:1,step:1},
                {l:"Multiplier x",val:mgMul,set:setMgMul,min:1.1,step:0.1},
              ].map(f=>(
                <div key={f.l} style={{background:card,border:`1px solid ${bdr}`,borderRadius:10,padding:"11px"}}>
                  <div style={{fontSize:9,color:sub,marginBottom:5}}>{f.l}</div>
                  <input type="number" value={f.val} min={f.min} step={f.step} onChange={e=>f.set(Math.max(f.min,parseFloat(e.target.value)||f.min))} style={{...inp}}/>
                </div>
              ))}
              <div style={{background:card,border:`1px solid ${bdr}`,borderRadius:10,padding:"11px"}}>
                <div style={{fontSize:9,color:sub,marginBottom:5}}>Losses Hadda</div>
                <div style={{display:"flex",gap:5,alignItems:"center"}}>
                  <button onClick={()=>setMgLoss(v=>Math.max(0,v-1))} style={{background:"rgba(255,60,80,0.15)",border:"1px solid rgba(255,60,80,0.3)",color:"#ff4d6a",borderRadius:5,padding:"4px 10px",fontSize:16}}>-</button>
                  <div style={{flex:1,textAlign:"center",fontSize:20,fontWeight:900,color:mgLoss===0?"#00ff88":mgLoss<=2?"#ffd60a":"#ff4d6a"}}>{mgLoss}</div>
                  <button onClick={()=>setMgLoss(v=>Math.min(5,v+1))} style={{background:"rgba(0,255,136,0.1)",border:"1px solid rgba(0,255,136,0.3)",color:"#00ff88",borderRadius:5,padding:"4px 10px",fontSize:16}}>+</button>
                </div>
              </div>
            </div>
            <div style={{display:"flex",flexDirection:"column",gap:6}}>
              {mgSteps.map((step,i)=>{
                const isNow=i===mgLoss,done=i<mgLoss;
                const col=isNow?"#ffd60a":done?"#ff4d6a":sub;
                return(
                  <div key={step.n} style={{background:isNow?"rgba(255,214,10,0.07)":done?"rgba(255,60,80,0.05)":card,border:`1px solid ${isNow?"rgba(255,214,10,0.4)":done?"rgba(255,60,80,0.18)":bdr}`,borderRadius:9,padding:"11px 13px",display:"flex",alignItems:"center",justifyContent:"space-between"}}>
                    <div style={{display:"flex",alignItems:"center",gap:9}}>
                      <div style={{width:28,height:28,borderRadius:6,background:isNow?"rgba(255,214,10,0.2)":done?"rgba(255,60,80,0.15)":"rgba(255,255,255,0.05)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:12,fontWeight:900,color:col}}>
                        {done?"X":isNow?">":step.n}
                      </div>
                      <div>
                        <div style={{fontSize:11,fontWeight:700,color:isNow?"#ffd60a":txt}}>Qaadista #{step.n} {isNow&&<span style={{fontSize:9,opacity:0.7}}>HADDA</span>}</div>
                        <div style={{fontSize:9,color:sub}}>Khataro: ${step.risk}</div>
                      </div>
                    </div>
                    <div style={{textAlign:"right"}}>
                      <div style={{fontSize:18,fontWeight:900,color:isNow?"#ffd60a":done?"#ff4d6a":"#00ff88"}}>${step.amt}</div>
                      <div style={{fontSize:8,color:sub}}>Net ~${parseFloat((step.amt*0.92-(i>0?mgSteps[i-1].risk:0)).toFixed(2))}</div>
                    </div>
                  </div>
                );
              })}
            </div>
            <div style={{marginTop:10,padding:"10px 13px",background:"rgba(0,180,216,0.07)",border:"1px solid rgba(0,180,216,0.15)",borderRadius:8,fontSize:10,color:"#00b4d8",lineHeight:1.7}}>
              Talo: Loss ka dib, lacagta labar u dhig. 5 loss isku xigaan hadduu noqdo, jooji.
            </div>
          </div>
        )}

        {/* DISCLAIMER */}
        <div style={{marginTop:16,padding:"10px 13px",background:"rgba(255,200,0,0.05)",border:"1px solid rgba(255,200,0,0.15)",borderRadius:9,fontSize:10,textAlign:"center",lineHeight:1.7,color:"#ffd60a"}}>
          Digniin: Marka hore <strong>Demo</strong> ku tijaabiyo — ka dib <strong>Real Account</strong> ka gal. Ganacsiga waxay leedahay khataro weyn.
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
