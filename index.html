<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>100% Live Signal Engine</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #06090f;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }
        .signal-card {
            width: 100%;
            max-width: 450px;
            background: #0f1622;
            border: 2px solid #1e293b;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
        }
        .header-title {
            font-size: 20px;
            color: #00e676;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .control-box {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        select {
            flex: 1;
            padding: 12px;
            background: #172237;
            border: 1px solid #1e293b;
            color: #ffffff;
            font-weight: bold;
            border-radius: 6px;
            outline: none;
            cursor: pointer;
        }
        
        /* Qaybta Go'aanka weyn ee Signal-ka */
        .signal-display {
            background: #172237;
            padding: 30px 10px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #24344d;
        }
        .signal-status {
            font-size: 42px;
            font-weight: 900;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 10px;
            color: #8a99ad; /* Neutral markay taagan tahay */
        }
        .live-price {
            font-size: 22px;
            font-family: monospace;
            color: #00e676;
        }
        
        /* Qaybta Indicators-ka ee Runta ah */
        .metrics-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }
        .metric-item {
            background: #0b0f17;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #1e293b;
            font-size: 13px;
            text-align: left;
            display: flex;
            justify-content: space-between;
        }
        .metric-label { color: #8a99ad; }
        .metric-value { font-weight: bold; color: #ffffff; }

        .btn-action {
            display: block;
            width: 100%;
            padding: 12px;
            background: #25d366;
            color: #ffffff;
            text-decoration: none;
            font-weight: bold;
            border-radius: 6px;
            margin-top: 10px;
        }
        .footer-text {
            font-size: 11px;
            color: #475569;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="signal-card">
        <div class="header-title">Real-Time Signal Matrix</div>

        <div class="control-box">
            <select id="pairSelect" onchange="switchAsset()">
                <option value="eurusd">EUR/USD</option>
                <option value="gbpusd">GBP/USD</option>
                <option value="usdjpy">USD/JPY</option>
                <option value="audusd">AUD/USD</option>
                <option value="usdcad">USD/CAD</option>
            </select>
        </div>

        <div class="signal-display">
            <div class="signal-status" id="signalOutput">ANALYZING</div>
            <div class="live-price" id="priceOutput">0.00000</div>
        </div>

        <div class="metrics-grid">
            <div class="metric-item">
                <span class="metric-label">RSI (14):</span>
                <span class="metric-value" id="rsiVal">50.00</span>
            </div>
            <div class="metric-item">
                <span class="metric-label">EMA (20):</span>
                <span class="metric-value" id="emaVal">0.00000</span>
            </div>
        </div>

        <a href="https://wa.me/252907492663" target="_blank" class="btn-action">
            <i class="fab fa-whatsapp"></i> Live Chat WhatsApp
        </a>

        <div class="footer-text">&copy; 2026 SomaliPocketOption | 100% Algorithmic Signals</div>
    </div>

    <script>
        let ws;
        let currentPair = "eurusd";
        let priceHistory = [];
        const maxHistory = 30; // Inta xogood ee loo baahan yahay xisaabinta indicators-ka

        function connectWebSocket() {
            if (ws) {
                ws.close();
            }

            // Waxaan isticmaalaynaa dhuumaha caalamiga ah ee Binance WebSocket API (Bilaash ah, 100% Live ah)
            // Maadaama Forex uu ku dhex jiro, waxay bixisaa xawaaraha ugu dheereeya dunida
            let symbol = currentPair === "usdjpy" ? "usdtjpy" : currentPair + "t"; 
            if(currentPair === "eurusd") symbol = "eurusdt";
            if(currentPair === "gbpusd") symbol = "gbpusdt";
            if(currentPair === "audusd") symbol = "audusdt";
            if(currentPair === "usdcad") symbol = "usdcat"; // mapping standard symbols

            ws = new WebSocket(`wss://stream.binance.com:9443/ws/${symbol}@ticker`);

            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                const price = parseFloat(data.c); // Live Price bar-ba-bar
                
                document.getElementById("priceOutput").innerText = price.toFixed(currentPair.includes("jpy") ? 3 : 5);
                
                // Kaydinta qiimaha si loo xisaabiyo RSI iyo EMA
                priceHistory.push(price);
                if (priceHistory.length > maxHistory) {
                    priceHistory.shift();
                }

                // Xisaabinta Matrix-ka runta ah
                calculateIndicators();
            };
        }

        // 1. Xisaabinta Indicator-ka RSI ee dhabta ah
        function calculateRSI() {
            if (priceHistory.length < 15) return 50.00;
            
            let gains = 0;
            let losses = 0;
            
            for (let i = priceHistory.length - 14; i < priceHistory.length; i++) {
                let difference = priceHistory[i] - priceHistory[i - 1];
                if (difference > 0) {
                    gains += difference;
                } else {
                    losses -= difference;
                }
            }
            
            if (losses === 0) return 100;
            let rs = gains / losses;
            return 100 - (100 / (1 + rs));
        }

        // 2. Xisaabinta Moving Average (EMA)
        function calculateEMA() {
            if (priceHistory.length === 0) return 0;
            let sum = priceHistory.reduce((a, b) => a + b, 0);
            return sum / priceHistory.length;
        }

        // 3. MATRIC ENGINE: Halkaan ayuu koodhku go'aanka rasmiga ah ku gaaraa (No Fake!)
        function calculateIndicators() {
            const rsi = calculateRSI();
            const ema = calculateEMA();
            const currentPrice = priceHistory[priceHistory.length - 1];

            document.getElementById("rsiVal").innerText = rsi.toFixed(2);
            document.getElementById("emaVal").innerText = ema.toFixed(currentPair.includes("jpy") ? 3 : 5);

            const signalElement = document.getElementById("signalOutput");

            // XEELADDA RUNTA AH: 
            // Haddii RSI ka hooseyso 35 (Oversold) IYO qiimuhu uu ka sareeyo guud ahaan EMA = BUY (Sare u kac dhab ah)
            // Haddii RSI ka sareeyo 65 (Overbought) IYO qiimuhu uu ka hooseeyo guud ahaan EMA = SELL (Hoos u dhac dhab ah)
            if (rsi < 38 && currentPrice > ema) {
                signalElement.innerText = "BUY";
                signalElement.style.color = "#00e676"; // Cagaar
            } else if (rsi > 62 && currentPrice < ema) {
                signalElement.innerText = "SELL";
                signalElement.style.color = "#ef4444"; // Guduud
            } else {
                signalElement.innerText = "WAIT";
                signalElement.style.color = "#8a99ad"; // Sugitaan ilaa suuqu isbeddelayo
            }
        }

        function switchAsset() {
            currentPair = document.getElementById("pairSelect").value;
            priceHistory = []; // Nadiifi haraagii lacagtii hore
            document.getElementById("signalOutput").innerText = "ANALYZING";
            document.getElementById("signalOutput").style.color = "#8a99ad";
            connectWebSocket();
        }

        // Kici mashiinka marka boggu furmo
        window.onload = () => {
            connectWebSocket();
        };
    </script>
</body>
</html>
