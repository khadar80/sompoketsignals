<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>100% Live Core Matrix - Institutional Challenge v3.3</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #06090f;
            color: #ffffff;
            font-family: 'Segoe UI', Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
        }
        .signal-card {
            width: 100%;
            max-width: 460px;
            background: #0f1622;
            border: 2px solid #1e293b;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
        }
        .header-title {
            font-size: 22px;
            font-weight: bold;
            color: #00e676;
            text-align: center;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .control-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .input-group label {
            font-size: 10px;
            color: #8a99ad;
            text-transform: uppercase;
            font-weight: bold;
        }
        select {
            padding: 12px;
            background: #172237;
            border: 1px solid #1e293b;
            color: #ffffff;
            font-weight: bold;
            border-radius: 6px;
            outline: none;
            cursor: pointer;
            font-size: 14px;
        }
        
        .signal-display {
            background: #172237;
            padding: 25px 10px;
            border-radius: 12px;
            margin-bottom: 15px;
            border: 1px solid #24344d;
            text-align: center;
            position: relative;
        }
        .signal-status {
            font-size: 46px;
            font-weight: 900;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 5px;
            color: #8a99ad;
        }
        .live-price {
            font-size: 26px;
            font-family: monospace;
            color: #00e676;
            font-weight: bold;
        }
        .pulse-dot {
            position: absolute;
            top: 15px;
            right: 15px;
            width: 8px;
            height: 8px;
            background-color: #00e676;
            border-radius: 50%;
            box-shadow: 0 0 8px #00e676;
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }
        .metric-item {
            background: #0b0f17;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #1e293b;
            font-size: 13px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .metric-label { color: #8a99ad; font-weight: 500; }
        .metric-value { font-weight: bold; color: #ffffff; font-family: monospace; }

        .btn-action {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 14px;
            background: #25d366;
            color: #ffffff;
            text-decoration: none;
            font-weight: bold;
            border-radius: 8px;
            font-size: 15px;
        }
        .footer-text {
            font-size: 11px;
            color: #475569;
            text-align: center;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="signal-card">
        <div class="header-title">100% Live Core Matrix</div>

        <div class="control-grid">
            <div class="input-group">
                <label><i class="fas fa-coins"></i> Pair-ka</label>
                <select id="pairSelect" onchange="switchAsset()">
                    <option value="eurusd">EURUSD</option>
                    <option value="gbpusd">GBPUSD</option>
                    <option value="usdjpy">USDJPY</option>
                    <option value="audusd">AUDUSD</option>
                    <option value="usdcad">USDCAD</option>
                    <option value="nzdusd">NZDUSD</option>
                </select>
            </div>
            <div class="input-group">
                <label><i class="fas fa-clock"></i> Mode</label>
                <select id="modeSelect" onchange="switchAsset()">
                    <option value="hybrid">HYBRID ALGO (OTC/REAL)</option>
                </select>
            </div>
        </div>

        <div class="signal-display">
            <div class="pulse-dot" id="livePulse"></div>
            <div class="signal-status" id="signalOutput">ANALYZING</div>
            <div class="live-price" id="priceOutput">Connecting...</div>
        </div>

        <div class="metrics-grid">
            <div class="metric-item">
                <span class="metric-label">RSI Matrix:</span>
                <span class="metric-value" id="rsiVal">50.00</span>
            </div>
            <div class="metric-item">
                <span class="metric-label">Algorithmic Trend:</span>
                <span class="metric-value" id="trendVal" style="color: #8a99ad;">STABLE</span>
            </div>
        </div>

        <a href="https://wa.me/252907492663" target="_blank" class="btn-action">
            <i class="fab fa-whatsapp"></i> Caawinaad Toos Ah (WhatsApp)
        </a>

        <div class="footer-text">&copy; 2026 SomaliPocketOption | Challenge Version v3.3</div>
    </div>

    <script>
        let ws;
        let currentPair = "eurusd";
        let priceHistory = [];
        let lastSignal = "WAIT";
        let signalLockTime = 0;
        const LOCK_DURATION = 12000; // 12 ilbiriqsi oo xasilooni ah

        function connectWebSocket() {
            if (ws) { ws.close(); }

            let symbol = currentPair + "t";
            if (currentPair === "usdjpy") symbol = "usdtjpy";

            ws = new WebSocket(`wss://stream.binance.com:9443/ws/${symbol}@ticker`);

            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                if(!data.c) return;
                
                const price = parseFloat(data.c);
                document.getElementById("priceOutput").innerText = price.toFixed(currentPair.includes("jpy") ? 3 : 5);
                
                // Si looga hortago istaaga bilowga ah ee array-ga
                if(priceHistory.length === 0) {
                    for(let i=0; i<35; i++) {
                        priceHistory.push(price - (Math.random() * 0.0001));
                    }
                }

                priceHistory.push(price);
                if (priceHistory.length > 60) { priceHistory.shift(); }

                calculateMatrix();
            };
        }

        function calculateRSI(period = 14) {
            if (priceHistory.length < period + 1) return 50.00;
            let gains = 0; let losses = 0;
            for (let i = priceHistory.length - period; i < priceHistory.length; i++) {
                let diff = priceHistory[i] - priceHistory[i - 1];
                if (diff > 0) gains += diff; else losses -= diff;
            }
            if (losses === 0) return 50.00;
            return 100 - (100 / (1 + (gains / losses)));
        }

        function calculateVolatility() {
            if (priceHistory.length < 10) return "NORMAL";
            let sum = 0;
            for(let i = priceHistory.length - 10; i < priceHistory.length; i++) {
                sum += Math.abs(priceHistory[i] - priceHistory[i-1]);
            }
            return sum;
        }

        function calculateMatrix() {
            const rsi = calculateRSI(14);
            const vol = calculateVolatility();
            const currentPrice = priceHistory[priceHistory.length - 1];
            const prevPrice = priceHistory[priceHistory.length - 2] || currentPrice;

            document.getElementById("rsiVal").innerText = rsi.toFixed(2);

            // Cabbirka Jihada Xawaaraha Qiimaha (Momentum Velocity Filter)
            let trend = "NEUTRAL";
            const trendElement = document.getElementById("trendVal");
            
            if (currentPrice > prevPrice) {
                trend = "BULLISH_VELOCITY";
                trendElement.innerText = "MOMENTUM UP";
                trendElement.style.color = "#00e676";
            } else if (currentPrice < prevPrice) {
                trend = "BEARISH_VELOCITY";
                trendElement.innerText = "MOMENTUM DOWN";
                trendElement.style.color = "#ef4444";
            }

            const signalElement = document.getElementById("signalOutput");
            const currentTime = Date.now();

            // Sifeynta inta u dhexaysa qufulka signal-kii hore
            if (currentTime - signalLockTime < LOCK_DURATION && lastSignal !== "WAIT") { return; }

            let currentDecision = "WAIT";

            // Xeelad aad u adag oo labada suuqba (Real iyo OTC) u adkeysan karta:
            // Haddii dardartu tahay kor, RSI-na ay muujiso in xoog cusub jiro (RSI u dhexaysa 45 iyo 52) = BUY
            // Haddii dardartu tahay hoos, RSI-na ay muujiso in hoos u dhac cusub jiro (RSI u dhexaysa 48 iyo 55) = SELL
            if (trend === "BULLISH_VELOCITY" && rsi > 45 && rsi < 54) {
                currentDecision = "BUY";
            } else if (trend === "BEARISH_VELOCITY" && rsi > 46 && rsi < 55) {
                currentDecision = "SELL";
            }

            if (currentDecision !== lastSignal) {
                lastSignal = currentDecision;
                signalElement.innerText = currentDecision;
                
                if (currentDecision === "BUY") {
                    signalElement.style.color = "#00e676";
                    signalLockTime = currentTime;
                } else if (currentDecision === "SELL") {
                    signalElement.style.color = "#ef4444";
                    signalLockTime = currentTime;
                } else {
                    signalElement.innerText = "ANALYZING";
                    signalElement.style.color = "#8a99ad";
                }
            }
        }

        function switchAsset() {
            currentPair = document.getElementById("pairSelect").value;
            priceHistory = [];
            lastSignal = "WAIT";
            signalLockTime = 0;
            document.getElementById("priceOutput").innerText = "Connecting...";
            document.getElementById("signalOutput").innerText = "ANALYZING";
            document.getElementById("signalOutput").style.color = "#8a99ad";
            connectWebSocket();
        }

        window.onload = () => {
            connectWebSocket();
        };
    </script>
</body>
</html>
