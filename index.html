<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signals · Somali Pocket Option</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #080d14;
            color: #e8f0fe;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 500px;
            width: 100%;
            background: #111a24;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            text-align: center;
            border: 1px solid #1f2d3d;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 10px;
            color: #00e676;
        }
        p {
            color: #8a99ad;
            font-size: 14px;
            margin-bottom: 25px;
        }
        .signal-box {
            background: #1b2735;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 25px;
            border-left: 5px solid #00e676;
        }
        .signal-title {
            font-weight: bold;
            font-size: 18px;
            margin-bottom: 5px;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            transition: background 0.3s ease;
        }
        .btn-primary {
            background: #00e676;
            color: #080d14;
        }
        .btn-primary:hover {
            background: #00b354;
        }
        .btn-tiktok {
            background: #ff0050;
            color: white;
        }
        .btn-tiktok:hover {
            background: #cc003f;
        }
        .footer {
            margin-top: 20px;
            font-size: 12px;
            color: #56667a;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Somali Pocket Option Signals</h1>
        <p>Ku soo dhowaad madasha rasmiga ah ee calaamadaha pargalka trading-ka.</p>

        <div class="signal-box">
            <div class="signal-title">🟢 Signal-ka Hadda furan: Active</div>
            <span style="color: #8a99ad; font-size: 13px;">Waa la cusboonaysiiyay hadda</span>
        </div>

        <a href="#" class="btn btn-primary">Halkan Ka Eeg Signal-ada Maanta</a>
        <a href="https://www.tiktok.com/" target="_blank" class="btn btn-tiktok">Nagala Soco TikTok</a>

        <div class="footer">
            &copy; 2026 ALNUUR STORE & BIID DESIGN. All rights reserved.
        </div>
    </div>

</body>
</html>
