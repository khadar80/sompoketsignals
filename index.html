<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Somali Signals 🇸🇴</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #080d14;
            color: #e8f0fe;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 500px;
            width: 100%;
            background: #111a24;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            text-align: center;
            border: 1px solid #1f2d3d;
        }
        h1 {
            font-size: 26px;
            margin-bottom: 10px;
            color: #00e676;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .motivation-text {
            color: #00e676;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 20px;
            line-height: 1.5;
        }
        .selector-box {
            margin-bottom: 15px;
            background: #1b2735;
            padding: 12px;
            border-radius: 8px;
            text-align: left;
        }
        .selector-box label {
            font-size: 11px;
            color: #8a99ad;
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
            letter-spacing: 0.5px;
        }
        .select-input {
            width: 100%;
            padding: 10px;
            background: #111a24;
            border: 1px solid #1f2d3d;
            border-radius: 6px;
            color: #ffffff;
            font-size: 15px;
            font-weight: bold;
            outline: none;
            cursor: pointer;
        }
        .widget-wrapper {
            background: #1b2735;
            padding: 10px;
            border-radius: 10px;
            margin-bottom: 15px;
            border: 1px solid #263238;
            min-height: 440px;
        }
        .chart-wrapper {
            background: #1b2735;
            padding: 10px;
            border-radius: 10px;
            margin-bottom: 20px;
            border: 1px solid #263238;
            height: 250px;
        }
        .lesson-box {
            background: #1b2735;
            padding: 18px;
            border-radius: 10px;
            margin-bottom: 15px;
            border-left: 4px solid #ff9800;
            text-align: left;
            min-height: 110px;
        }
        .lesson-title {
            font-size: 13px;
            color: #ff9800;
            font-weight: bold;
            margin-bottom: 6px;
        }
        .lesson-content {
            font-size: 12px;
            color: #b0bec5;
            line-height: 1.6;
        }
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            transition: background 0.3s ease;
        }
        .btn-whatsapp {
            background: #25d366;
            color: #ffffff;
        }
        .btn-whatsapp:hover {
            background: #1ebd58;
        }
        .btn-tiktok {
            background: #ff0050;
            color: white;
        }
        .btn-tiktok:hover {
            background: #cc003f;
        }
        .footer {
            margin-top: 15px;
            font-size: 12px;
            color: #56667a;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Somali Signals 🇸🇴</h1>
        <div class="motivation-text">"Guushu kuma timaaddo dhalanteed, waxay ku dhalataa go'aan adag, samir iyo edbin ganacsi. Maareey maalkaaga!"</div>

        <div class="selector-box">
            <label>DOORO LACAGTA AAD RABTO (ASSET)</label>
            <select class="select-input" id="assetSelector" onchange="changeLiveAsset()">
                <optgroup label="Major Pairs">
                    <option value="EURUSD">EUR/USD</option>
                    <option value="GBPUSD">GBP/USD</option>
                    <option value="USDJPY">USD/JPY</option>
                    <option value="AUDUSD">AUD/USD</option>
                    <option value="USDCAD">USD/CAD</option>
                    <option value="USDCHF">USD/CHF</option>
                    <option value="NZDUSD">NZD/USD</option>
                </optgroup>
                <optgroup label="Cross Pairs">
                    <option value="EURGBP">EUR/GBP</option>
                    <option value="EURJPY">EUR/JPY</option>
                    <option value="GBPJPY">GBP/JPY</option>
                    <option value="EURCHF">EUR/CHF</option>
                </optgroup>
            </select>
        </div>

        <div class="chart-wrapper" id="chartContainer"></div>

        <div class="widget-wrapper" id="widgetContainer"></div>

        <div class="lesson-box">
            <div class="lesson-title" id="lessonTitle">📚 CASHARKA MAANTA: Sugaya...</div>
            <div class="lesson-content" id="lessonContent">Xogta casharrada ayaa hadda xisaabtamaysa...</div>
        </div>

        <a href="https://wa.me/252907492663" target="_blank" class="btn btn-whatsapp">
            <i class="fab fa-whatsapp"></i> Caawinaad Toos Ah (WhatsApp)
        </a>
        <a href="https://www.tiktok.com/@khadar_kuwarizma" target="_blank" class="btn btn-tiktok">
            <i class="fab fa-tiktok"></i> Nagala Soco TikTok
        </a>

        <div class="footer">
            &copy; 2026 SomaliPocketOption. All rights reserved.
        </div>
    </div>

    <script>
        const tradingLessons = [
            { title: "📚 XEERKA RISK MANAGEMENT (1%)", content: "Waligaa hal trade ha u isticmaalin wax ka badan 1% ilaa 2% oo kamid ah lacagta kuugu jirta akaount-kaaga. Tani waxay kaa caawinaysaa inaad suuqa sii joogto xataa haddii aad dhowr jeer khasaarto." },
            { title: "🕯️ CODKA CANDLESTICK PATTERNS", content: "Markaad aragto shumaca 'Hammer' ama 'Pin Bar' oo ku dhuftay aagga Support-ka, waxay muujinaysaa in iibsadayaashu (Buyers) suuqa soo galeen, nidaamkuna uu u dhow yahay iib kor u kac ah (BUY)." },
            { title: "📉 KELIYA RAAC TREND-KA SUUQA", content: "Xikmadda suuqa waxay leedahay: 'The trend is your friend'. Haddii suuqu yahay Uptrend, kaliya raadi fursado BUY ah. Ha isku dayin inaad ka hor ttagto jiho xooggan." },
            { title: "🧠 EDXIBTA GANACSIGA (TRADING DISCIPLINE)", content: "Khasaaruhu waa qayb ganacsiga kamid ah. Haddii aad lumiso 3 trade oo isku xiga maanta, dami kombiyuutarka ama moobilka. Ha isku dayin inaad aargudato." }
        ];

        let currentLessonIndex = 0;

        function rotateLessons() {
            const titleElement = document.getElementById("lessonTitle");
            const contentElement = document.getElementById("lessonContent");
            const currentLesson = tradingLessons[currentLessonIndex];
            titleElement.innerText = currentLesson.title;
            contentElement.innerText = currentLesson.content;
            currentLessonIndex = (currentLessonIndex + 1) % tradingLessons.length;
        }

        // Nidaamka soo xoraynta Mitirka Signal-ka
        function loadSignalWidget(symbol) {
            const container = document.getElementById("widgetContainer");
            container.innerHTML = ""; 
            const widgetScript = document.createElement("script");
            widgetScript.type = "text/javascript";
            widgetScript.src = "https://s3.tradingview.com/external-embedding/embed-widget-technical-analysis.js";
            widgetScript.async = true;

            widgetScript.innerHTML = JSON.stringify({
                "interval": "1m",
                "width": "100%",
                "isTransparent": true,
                "height": 440,
                "symbol": "FX:" + symbol,
                "showIntervalTabs": true,
                "displayMode": "single",
                "locale": "en",
                "colorTheme": "dark"
            });
            container.appendChild(widgetScript);
        }

        // Nidaamka soo xoraynta Garaafka Shumacda (Mini Candle Chart)
        function loadChartWidget(symbol) {
            const container = document.getElementById("chartContainer");
            container.innerHTML = "";
            const chartScript = document.createElement("script");
            chartScript.type = "text/javascript";
            chartScript.src = "https://s3.tradingview.com/external-embedding/embed-widget-mini-symbol-overview.js";
            chartScript.async = true;

            chartScript.innerHTML = JSON.stringify({
                "symbol": "FX:" + symbol,
                "width": "100%",
                "height": "100%",
                "locale": "en",
                "dateRange": "1d",
                "colorTheme": "dark",
                "trendLineColor": "rgba(0, 230, 118, 1)",
                "underLineColor": "rgba(0, 230, 118, 0.1)",
                "underLineBottomColor": "rgba(0, 230, 118, 0)",
                "isTransparent": true,
                "autosize": true
            });
            container.appendChild(chartScript);
        }

        function changeLiveAsset() {
            const selectedSymbol = document.getElementById("assetSelector").value;
            loadSignalWidget(selectedSymbol);
            loadChartWidget(selectedSymbol);
        }

        window.onload = function() {
            loadSignalWidget("EURUSD");
            loadChartWidget("EURUSD");
            rotateLessons();
            setInterval(rotateLessons, 20000); 
        };
    </script>
</body>
</html>
