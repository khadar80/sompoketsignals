<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <title>Price Action & Signal Convergence v3.7</title>
    <style>
        body { background: #06090f; color: #fff; font-family: monospace; display: flex; justify-content: center; padding: 20px; }
        .card { width: 100%; max-width: 400px; background: #0f1622; padding: 25px; border-radius: 16px; border: 1px solid #1e293b; }
        .price { font-size: 32px; color: #00e676; text-align: center; margin: 15px 0; }
        .signal-box { height: 100px; display: flex; align-items: center; justify-content: center; font-size: 36px; font-weight: 900; border: 2px solid #24344d; border-radius: 12px; margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="card">
        <h3 style="text-align:center; color:#8a99ad;">LIVE PRICE ACTION FEED</h3>
        <div id="price" class="price">0.00000</div>
        <div id="signal" class="signal-box">ANALYZING</div>
        <select id="pairSelect" onchange="switchAsset()" style="width:100%; padding:10px; background:#172237; color:#fff; border:none; border-radius:6px;">
            <option value="EURUSD">EUR/USD</option>
            <option value="GBPUSD">GBP/USD</option>
            <option value="USDJPY">USD/JPY</option>
            <option value="AUDUSD">AUD/USD</option>
        </select>
    </div>

    <script>
        let ws;
        let lastPrice = 0;
        const symbolMap = {"EURUSD":"eurusdt", "GBPUSD":"gbpusdt", "USDJPY":"usdtjpy", "AUDUSD":"audusdt"};

        function switchAsset() {
            if(ws) ws.close();
            let pair = document.getElementById("pairSelect").value;
            ws = new WebSocket(`wss://stream.binance.com:9443/ws/${symbolMap[pair]}@ticker`);
            ws.onmessage = (event) => {
                let data = JSON.parse(event.data);
                let currentPrice = parseFloat(data.c);
                document.getElementById("price").innerText = currentPrice.toFixed(pair.includes("JPY") ? 3 : 5);
                
                // PRICE ACTION LOGIC: 
                // Haddii qiimuhu kor u boodo (Momentum), Signal-ku waa BUY
                // Haddii qiimuhu hoos u dhaco (Momentum), Signal-ku waa SELL
                let signalEl = document.getElementById("signal");
                if (currentPrice > lastPrice + 0.00002) {
                    signalEl.innerText = "BUY";
                    signalEl.style.color = "#00e676";
                } else if (currentPrice < lastPrice - 0.00002) {
                    signalEl.innerText = "SELL";
                    signalEl.style.color = "#ef4444";
                }
                lastPrice = currentPrice;
            };
        }
        switchAsset();
    </script>
</body>
</html>
