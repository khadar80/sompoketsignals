<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <title>ZERO-LAG FOREX ENGINE v6.0</title>
    <style>
        body { background: #06090f; color: #fff; font-family: monospace; display: flex; justify-content: center; padding: 20px; }
        .box { width: 100%; max-width: 400px; background: #0f1622; padding: 20px; border-radius: 12px; border: 1px solid #24344d; text-align: center; }
        #price { font-size: 36px; color: #00e676; margin: 20px 0; font-weight: bold; }
        select { width: 100%; padding: 12px; background: #172237; color: #fff; border: 1px solid #24344d; border-radius: 6px; }
        .signal { font-size: 30px; margin-top: 10px; font-weight: 900; }
    </style>
</head>
<body>
<div class="box">
    <h3>FOREX LIVE v6.0</h3>
    <select id="pair" onchange="init()">
        <option value="eurusdt">EUR/USD</option>
        <option value="gbpusdt">GBP/USD</option>
        <option value="usdtjpy">USD/JPY</option>
        <option value="audusdt">AUD/USD</option>
        <option value="usdcadt">USD/CAD</option>
        <option value="usdchft">USD/CHF</option>
    </select>
    <div id="price">SELECT PAIR...</div>
    <div id="signal" class="signal">ANALYZING...</div>
</div>

<script>
    let ws;
    function init() {
        if(ws) ws.close(); // Hubinta inaanan Fake helin
        let pair = document.getElementById("pair").value;
        document.getElementById("price").innerText = "CONNECTING...";
        
        // Binance API-ka oo si toos ah ula socda Pair-ka
        ws = new WebSocket(`wss://stream.binance.com:9443/ws/${pair}@ticker`);
        
        ws.onmessage = (event) => {
            let data = JSON.parse(event.data);
            let p = parseFloat(data.c).toFixed(5);
            document.getElementById("price").innerText = p;
            
            // Real-time signal generator
            let s = document.getElementById("signal");
            if(data.P > 0.01) { s.innerText="UPWARD"; s.style.color="#00e676"; }
            else if(data.P < -0.01) { s.innerText="DOWNWARD"; s.style.color="#ef4444"; }
        };
    }
    init();
</script>
</body>
</html>
