<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Somali Elite Signals Hub 🇸🇴</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #06090e;
            color: #e8f0fe;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 15px;
        }
        .container {
            max-width: 520px;
            width: 100%;
            background: #0f1622;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            text-align: center;
            border: 1px solid #1e293b;
        }
        h1 {
            font-size: 26px;
            margin-bottom: 10px;
            color: #00e676;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .motivation-text {
            color: #00e676;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 15px;
            line-height: 1.5;
        }
        
        /* Live Ticker Tape Style */
        .ticker-wrapper {
            margin-bottom: 15px;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #1e293b;
        }

        .selector-box {
            margin-bottom: 15px;
            background: #172237;
            padding: 12px;
            border-radius: 8px;
            text-align: left;
        }
        .selector-box label {
            font-size: 11px;
            color: #94a3b8;
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
            letter-spacing: 0.5px;
        }
        .select-input {
            width: 100%;
            padding: 10px;
            background: #0f1622;
            border: 1px solid #1e293b;
            border-radius: 6px;
            color: #ffffff;
            font-size: 15px;
            font-weight: bold;
            outline: none;
            cursor: pointer;
        }
        
        /* Timeframe Selection Styled Dropdown */
        .time-select {
            width: 100%;
            padding: 10px;
            background: #0f1622;
            border: 1px solid #1e293b;
            border-radius: 6px;
            color: #00e676;
            font-size: 15px;
            font-weight: bold;
            outline: none;
            cursor: pointer;
        }

        /* Widgets Containers */
        .widget-wrapper {
            background: #172237;
            padding: 8px;
            border-radius: 10px;
            margin-bottom: 15px;
            border: 1px solid #1e293b;
            min-height: 220px;
        }
        .section-title {
            font-size: 12px;
            color: #ff9800;
            font-weight: bold;
            text-align: left;
            margin-bottom: 8px;
            padding-left: 5px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        #gaugeContainer { min-height: 220px; }
        
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            transition: background 0.3s ease;
        }
        .btn-whatsapp { background: #25d366; color: #ffffff; }
        .btn-tiktok { background: #ff0050; color: white; }
        .footer { margin-top: 15px; font-size: 12px; color: #475569; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Somali Signals Hub 🇸🇴</h1>
        <div class="motivation-text">"Guushu kuma timaaddo dhalanteed, waxay ku dhalataa go'aan adag, samir iyo edbin ganacsi. Maareey maalkaaga!"</div>

        <div class="ticker-wrapper" id="tickerContainer"></div>

        <div class="selector-box">
            <label><i class="fas fa-coins"></i> DOORO LACAGTA AAD RABTO (FOREX PAIR)</label>
            <select class="select-input" id="assetSelector" onchange="onWidgetUpdate()">
                <optgroup label="Major Forex Pairs">
                    <option value="EURUSD">EUR/USD (Euro / US Dollar)</option>
                    <option value="GBPUSD">GBP/USD (British Pound / US Dollar)</option>
                    <option value="USDJPY">USD/JPY (US Dollar / Japanese Yen)</option>
                    <option value="AUDUSD">AUD/USD (Australian Dollar / US Dollar)</option>
                    <option value="USDCAD">USD/CAD (US Dollar / Canadian Dollar)</option>
                    <option value="USDCHF">USD/CHF (US Dollar / Swiss Franc)</option>
                    <option value="NZDUSD">NZD/USD (New Zealand Dollar / US Dollar)</option>
                </optgroup>
                <optgroup label="Euro Crosses">
                    <option value="EURGBP">EUR/GBP (Euro / British Pound)</option>
                    <option value="EURJPY">EUR/JPY (Euro / Japanese Yen)</option>
                    <option value="EURAUD">EUR/AUD (Euro / Australian Dollar)</option>
                    <option value="EURCAD">EUR/CAD (Euro / Canadian Dollar)</option>
                    <option value="EURCHF">EUR/CHF (Euro / Swiss Franc)</option>
                    <option value="EURNZD">EUR/NZD (Euro / New Zealand Dollar)</option>
                </optgroup>
                <optgroup label="GBP Crosses">
                    <option value="GBPJPY">GBP/JPY (British Pound / Japanese Yen)</option>
                    <option value="GBPAUD">GBP/AUD (British Pound / Australian Dollar)</option>
                    <option value="GBPCAD">GBP/CAD (British Pound / Canadian Dollar)</option>
                    <option value="GBPCHF">GBP/CHF (British Pound / Swiss Franc)</option>
                    <option value="GBPNZD">GBP/NZD (British Pound / New Zealand Dollar)</option>
                </optgroup>
                <optgroup label="Minor Crosses">
                    <option value="AUDJPY">AUD/JPY</option>
                    <option value="CADJPY">CAD/JPY</option>
                    <option value="CHFJPY">CHF/JPY</option>
                    <option value="NZDJPY">NZD/JPY</option>
                </optgroup>
            </select>
        </div>

        <div class="selector-box">
            <label><i class="fas fa-clock"></i> DOORO TIMEFRAME-KA (EXPIRY TIME)</label>
            <select class="time-select" id="timeframeSelector" onchange="onWidgetUpdate()">
                <option value="1m">1 Daqiiqo (1M - Scalping)</option>
                <option value="5m">5 Daqiiqo (5M - Fast Trade)</option>
                <option value="15m">15 Daqiiqo (15M - Standard)</option>
                <option value="1h">1 Saac (1H - Intraday)</option>
                <option value="4h">4 Saacadood (4H - Swing)</option>
                <option value="1d">1 Maalinti (1D - Long Term)</option>
            </select>
        </div>

        <div class="section-title"><i class="fas fa-bolt"></i> Go'aanka Signal-ka Live-ka ah (BUY / SELL)</div>
        <div class="widget-wrapper" id="gaugeContainer"></div>

        <a href="https://wa.me/252907492663" target="_blank" class="btn btn-whatsapp">
            <i class="fab fa-whatsapp"></i> Caawinaad Toos Ah (WhatsApp)
        </a>
        <a href="https://www.tiktok.com/@khadar_kuwarizma" target="_blank" class="btn btn-tiktok">
            <i class="fab fa-tiktok"></i> Nagala Soco TikTok
        </a>

        <div class="footer">
            &copy; 2026 SomaliPocketOption. All rights reserved.
        </div>
    </div>

    <script>
        // Ticker Tape widget (Multi-source data fed from diverse global feeds)
        function loadTickerTapeWidget() {
            const container = document.getElementById("tickerContainer");
            container.innerHTML = "";
            const tickerScript = document.createElement("script");
            tickerScript.type = "text/javascript";
            tickerScript.src = "https://s3.tradingview.com/external-embedding/embed-widget-ticker-tape.js";
            tickerScript.async = true;
            tickerScript.innerHTML = JSON.stringify({
                "symbols": [
                    {"proName": "FX_IDC:EURUSD", "title": "EUR/USD"},
                    {"proName": "FX_IDC:GBPUSD", "title": "GBP/USD"},
                    {"proName": "FX_IDC:USDJPY", "title": "USD/JPY"},
                    {"proName": "FX_IDC:AUDUSD", "title": "AUD/USD"},
                    {"proName": "FX_IDC:USDCAD", "title": "USD/CAD"}
                ],
                "showSymbolLogo": true,
                "colorTheme": "dark",
                "isTransparent": true,
                "displayMode": "adaptive",
                "locale": "en"
            });
            container.appendChild(tickerScript);
        }

        // Live Technical Engine (Brings instantaneous BUY/SELL meters directly)
        function loadGaugeWidget(symbol, timeframe) {
            const container = document.getElementById("gaugeContainer");
            container.innerHTML = ""; 
            const widgetScript = document.createElement("script");
            widgetScript.type = "text/javascript";
            widgetScript.src = "https://s3.tradingview.com/external-embedding/embed-widget-technical-analysis.js";
            widgetScript.async = true;
            widgetScript.innerHTML = JSON.stringify({
                "interval": timeframe,
                "width": "100%",
                "isTransparent": true,
                "height": 220,
                "symbol": "FX:" + symbol,
                "showIntervalTabs": false,
                "displayMode": "adaptive",
                "locale": "en",
                "colorTheme": "dark"
            });
            container.appendChild(widgetScript);
        }

        function onWidgetUpdate() {
            const selectedAsset = document.getElementById("assetSelector").value;
            const selectedTimeframe = document.getElementById("timeframeSelector").value;
            loadGaugeWidget(selectedAsset, selectedTimeframe);
        }

        window.onload = function() {
            loadTickerTapeWidget();
            loadGaugeWidget("EURUSD", "1m"); // Default loading setup
        };
    </script>
</body>
</html>
