<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Somali Signals 🇸🇴</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #080d14;
            color: #e8f0fe;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 10px;
        }
        .container {
            max-width: 500px;
            width: 100%;
            background: #111a24;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            text-align: center;
            border: 1px solid #1f2d3d;
            overflow: hidden;
        }
        h1 {
            font-size: 26px;
            margin-bottom: 10px;
            color: #00e676;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .motivation-text {
            color: #00e676;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 15px;
            line-height: 1.5;
        }
        
        /* Live Ticker Tape Container */
        .ticker-wrapper {
            margin-bottom: 15px;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #1f2d3d;
        }

        .selector-box {
            margin-bottom: 15px;
            background: #1b2735;
            padding: 12px;
            border-radius: 8px;
            text-align: left;
        }
        .selector-box label {
            font-size: 11px;
            color: #8a99ad;
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
            letter-spacing: 0.5px;
        }
        .select-input {
            width: 100%;
            padding: 10px;
            background: #111a24;
            border: 1px solid #1f2d3d;
            border-radius: 6px;
            color: #ffffff;
            font-size: 15px;
            font-weight: bold;
            outline: none;
            cursor: pointer;
        }
        
        .time-btn-group {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 5px;
        }
        .time-btn {
            flex: 1;
            background: #111a24;
            color: #8a99ad;
            border: 1px solid #1f2d3d;
            padding: 8px 0;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
            transition: all 0.3s;
        }
        .time-btn.active {
            background: #00e676;
            color: #080d14;
            border-color: #00e676;
        }

        .widget-wrapper {
            background: #1b2735;
            padding: 10px;
            border-radius: 10px;
            margin-bottom: 15px;
            border: 1px solid #263238;
            min-height: 440px;
        }
        .section-title {
            font-size: 12px;
            color: #ff9800;
            font-weight: bold;
            text-align: left;
            margin-bottom: 8px;
            padding-left: 5px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            transition: background 0.3s ease;
        }
        .btn-whatsapp { background: #25d366; color: #ffffff; }
        .btn-tiktok { background: #ff0050; color: white; }
        .footer { margin-top: 15px; font-size: 12px; color: #56667a; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Somali Signals 🇸🇴</h1>
        <div class="motivation-text">"Guushu kuma timaaddo dhalanteed, waxay ku dhalataa go'aan adag, samir iyo edbin ganacsi. Maareey maalkaaga!"</div>

        <div class="ticker-wrapper" id="tickerContainer"></div>

        <div class="selector-box">
            <label>DOORO LACAGTA AAD RABTO (ASSET)</label>
            <select class="select-input" id="assetSelector" onchange="onWidgetUpdate()">
                <optgroup label="Major Pairs">
                    <option value="EURUSD">EUR/USD</option>
                    <option value="GBPUSD">GBP/USD</option>
                    <option value="USDJPY">USD/JPY</option>
                    <option value="AUDUSD">AUD/USD</option>
                    <option value="USDCAD">USD/CAD</option>
                    <option value="USDCHF">USD/CHF</option>
                    <option value="NZDUSD">NZD/USD</option>
                </optgroup>
                <optgroup label="Euro Crosses">
                    <option value="EURGBP">EUR/GBP</option>
                    <option value="EURJPY">EUR/JPY</option>
                    <option value="EURAUD">EUR/AUD</option>
                    <option value="EURCAD">EUR/CAD</option>
                    <option value="EURCHF">EUR/CHF</option>
                </optgroup>
                <optgroup label="GBP Crosses">
                    <option value="GBPJPY">GBP/JPY</option>
                    <option value="GBPAUD">GBP/AUD</option>
                    <option value="GBPCAD">GBP/CAD</option>
                    <option value="GBPCHF">GBP/CHF</option>
                </optgroup>
            </select>
        </div>

        <div class="selector-box">
            <label>DOORO TIMEFRAME-KA (WAQTIGA)</label>
            <div class="time-btn-group">
                <button class="time-btn active" onclick="changeTimeframe('1m', this)">1M</button>
                <button class="time-btn" onclick="changeTimeframe('5m', this)">5M</button>
                <button class="time-btn" onclick="changeTimeframe('15m', this)">15M</button>
            </div>
        </div>

        <div class="section-title"><i class="fas fa-chart-pie"></i> Falanqaynta Suuqa iyo Signal-ka Live-ka ah</div>
        <div class="widget-wrapper" id="summaryContainer"></div>

        <a href="https://wa.me/252907492663" target="_blank" class="btn btn-whatsapp">
            <i class="fab fa-whatsapp"></i> Caawinaad Toos Ah (WhatsApp)
        </a>
        <a href="https://www.tiktok.com/@khadar_kuwarizma" target="_blank" class="btn btn-tiktok">
            <i class="fab fa-tiktok"></i> Nagala Soco TikTok
        </a>

        <div class="footer">
            &copy; 2026 SomaliPocketOption. All rights reserved.
        </div>
    </div>

    <script>
        let selectedAsset = "EURUSD";
        let selectedTimeframe = "1m";

        // Soo xoraynta Live Ticker Tape (Khadka socda ee qiimaha suuqyada aduunka)
        function loadTickerTapeWidget() {
            const container = document.getElementById("tickerContainer");
            container.innerHTML = "";
            const tickerScript = document.createElement("script");
            tickerScript.type = "text/javascript";
            tickerScript.src = "https://s3.tradingview.com/external-embedding/embed-widget-ticker-tape.js";
            tickerScript.async = true;
            tickerScript.innerHTML = JSON.stringify({
                "symbols": [
                    {"proName": "FX_IDC:EURUSD", "title": "EUR/USD"},
                    {"proName": "FX_IDC:GBPUSD", "title": "GBP/USD"},
                    {"proName": "FX_IDC:USDJPY", "title": "USD/JPY"},
                    {"proName": "FX_IDC:AUDUSD", "title": "AUD/USD"},
                    {"proName": "FX_IDC:USDCAD", "title": "USD/CAD"}
                ],
                "showSymbolLogo": true,
                "colorTheme": "dark",
                "isTransparent": true,
                "displayMode": "adaptive",
                "locale": "en"
            });
            container.appendChild(tickerScript);
        }

        // Soo xoraynta Mitirka rasmiga ah (Technical Summary Widget)
        function loadSummaryWidget(symbol, timeframe) {
            const container = document.getElementById("summaryContainer");
            container.innerHTML = ""; 
            const widgetScript = document.createElement("script");
            widgetScript.type = "text/javascript";
            widgetScript.src = "https://s3.tradingview.com/external-embedding/embed-widget-technical-analysis.js";
            widgetScript.async = true;
            widgetScript.innerHTML = JSON.stringify({
                "interval": timeframe,
                "width": "100%",
                "isTransparent": true,
                "height": 440,
                "symbol": "FX:" + symbol,
                "showIntervalTabs": false,
                "displayMode": "single",
                "locale": "en",
                "colorTheme": "dark"
            });
            container.appendChild(widgetScript);
        }

        function onWidgetUpdate() {
            selectedAsset = document.getElementById("assetSelector").value;
            loadSummaryWidget(selectedAsset, selectedTimeframe);
        }

        function changeTimeframe(timeframe, btn) {
            selectedTimeframe = timeframe;
            document.querySelectorAll('.time-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            
            loadSummaryWidget(selectedAsset, selectedTimeframe);
        }

        window.onload = function() {
            loadTickerTapeWidget(); // Khadka socda wuxuu dhashaa hal jeer
            loadSummaryWidget("EURUSD", "1m"); // Mitirka Live-ka ah
        };
    </script>
</body>
</html>
