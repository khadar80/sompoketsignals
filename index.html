<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <title>Professional Live Forex Engine v5.0</title>
    <style>
        body { background: #06090f; color: white; font-family: sans-serif; display: flex; justify-content: center; padding: 20px; }
        .box { width: 100%; max-width: 400px; background: #0f1622; padding: 20px; border-radius: 15px; border: 1px solid #24344d; text-align: center; }
        .price { font-size: 32px; font-weight: bold; color: #00e676; margin: 20px 0; }
        select { width: 100%; padding: 12px; background: #172237; color: white; border: none; border-radius: 8px; margin-bottom: 10px; }
    </style>
</head>
<body>
<div class="box">
    <h3>REAL FOREX ENGINE v5.0</h3>
    <select id="pair" onchange="updateConnection()">
        <option value="EURUSD">EUR/USD</option>
        <option value="GBPUSD">GBP/USD</option>
        <option value="USDJPY">USD/JPY</option>
        <option value="AUDUSD">AUD/USD</option>
        <option value="USDCAD">USD/CAD</option>
        <option value="USDCHF">USD/CHF</option>
        <option value="NZDUSD">NZD/USD</option>
    </select>

    <div id="price" class="price">Loading...</div>
    <div id="status" style="color: #8a99ad;">Connecting...</div>
</div>

<script>
    let ws;
    // Map rasmi ah oo Binance u yaqaan Pairs-ka Forex
    const pairMap = {
        "EURUSD": "eurusdt", "GBPUSD": "gbpusdt", "USDJPY": "usdtjpy",
        "AUDUSD": "audusdt", "USDCAD": "usdcadt", "USDCHF": "usdchft", "NZDUSD": "nzdusdt"
    };

    function updateConnection() {
        if(ws) ws.close(); // Tani waa furaha: Xir xogta hore si aysan u "fake" noqon
        let selected = document.getElementById("pair").value;
        let symbol = pairMap[selected];
        
        document.getElementById("status").innerText = "Live: " + selected;
        ws = new WebSocket(`wss://stream.binance.com:9443/ws/${symbol}@ticker`);
        
        ws.onmessage = (e) => {
            let data = JSON.parse(e.data);
            document.getElementById("price").innerText = parseFloat(data.c).toFixed(selected.includes("JPY") ? 3 : 5);
        };
    }
    updateConnection();
</script>
</body>
</html>
