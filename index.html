<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signals · Somali Pocket Option</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #080d14;
            color: #e8f0fe;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 500px;
            width: 100%;
            background: #111a24;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            text-align: center;
            border: 1px solid #1f2d3d;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 10px;
            color: #00e676;
        }
        .motivation-text {
            color: #00e676;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 20px;
            line-height: 1.5;
        }
        .selector-box {
            margin-bottom: 15px;
            background: #1b2735;
            padding: 12px;
            border-radius: 8px;
            text-align: left;
        }
        .selector-box label {
            font-size: 11px;
            color: #8a99ad;
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
            letter-spacing: 0.5px;
        }
        .select-input {
            width: 100%;
            padding: 10px;
            background: #111a24;
            border: 1px solid #1f2d3d;
            border-radius: 6px;
            color: #ffffff;
            font-size: 15px;
            font-weight: bold;
            outline: none;
            cursor: pointer;
        }
        .widget-wrapper {
            background: #1b2735;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            border: 1px solid #263238;
            min-height: 400px;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            transition: background 0.3s ease;
            text-align: center;
        }
        .btn-tiktok {
            background: #ff0050;
            color: white;
        }
        .btn-tiktok:hover {
            background: #cc003f;
        }
        .footer {
            margin-top: 15px;
            font-size: 12px;
            color: #56667a;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Somali Pocket Option</h1>
        <div class="motivation-text">"Guushu kuma timaaddo dhalanteed, waxay ku dhalataa go'aan adag, samir iyo edbin ganacsi. Maareey maalkaaga!"</div>

        <div class="selector-box">
            <label>DOORO LACAGTA AAD RABTO (ASSET)</label>
            <select class="select-input" id="assetSelector" onchange="changeLiveAsset()">
                <option value="FX:EURUSD">EUR/USD</option>
                <option value="FX:GBPUSD">GBP/USD</option>
                <option value="FX:USDJPY">USD/JPY</option>
                <option value="FX:AUDUSD">AUD/USD</option>
                <option value="FX:EURGBP">EUR/GBP</option>
                <option value="FX:USDCAD">USD/CAD</option>
            </select>
        </div>

        <div class="widget-wrapper" id="widgetContainer">
            </div>

        <a href="https://www.tiktok.com/@khadar_kuwarizma" target="_blank" class="btn btn-tiktok">Nagala Soco TikTok</a>

        <div class="footer">
            &copy; 2026 ALNUUR STORE & BIID DESIGN.
        </div>
    </div>

    <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-technical-analysis.js" async>
    </script>

    <script>
        function loadTradingViewWidget(symbol) {
            const container = document.getElementById("widgetContainer");
            container.innerHTML = ""; // Nadiifinta widget-kii hore

            // Abuurista qaab-dhismeedka Widget-ka dhabta ah ee TradingView
            const widgetScript = document.createElement("script");
            widgetScript.type = "text/javascript";
            widgetScript.src = "https://s3.tradingview.com/external-embedding/embed-widget-technical-analysis.js";
            widgetScript.async = true;

            // Habaynta qaabka widget-ka (100% Live market analysis)
            const widgetConfig = {
                "interval": "1m",
                "width": "100%",
                "isTransparent": true,
                "height": 420,
                "symbol": symbol,
                "showIntervalTabs": true,
                "displayMode": "single",
                "locale": "en",
                "colorTheme": "dark"
            };

            widgetScript.innerHTML = JSON.stringify(widgetConfig);
            container.appendChild(widgetScript);
        }

        function changeLiveAsset() {
            const selectedSymbol = document.getElementById("assetSelector").value;
            loadTradingViewWidget(selectedSymbol);
        }

        // Marka boggu uu soo tago, si toos ah u fur EUR/USD
        window.onload = function() {
            loadTradingViewWidget("FX:EURUSD");
        };
    </script>

</body>
</html>
