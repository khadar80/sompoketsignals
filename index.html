<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signals · Somali Pocket Option</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #080d14;
            color: #e8f0fe;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 500px;
            width: 100%;
            background: #111a24;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            text-align: center;
            border: 1px solid #1f2d3d;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 10px;
            color: #00e676;
        }
        p {
            color: #8a99ad;
            font-size: 14px;
            margin-bottom: 25px;
        }
        .signal-box {
            background: #1b2735;
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 25px;
            border-left: 5px solid #00e676;
            transition: all 0.5s ease;
        }
        .signal-display {
            font-size: 24px;
            font-weight: bold;
            margin: 15px 0;
            letter-spacing: 1px;
        }
        .countdown-box {
            font-size: 14px;
            color: #ff9800;
            margin-top: 10px;
            font-weight: bold;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            transition: background 0.3s ease;
        }
        .btn-tiktok {
            background: #ff0050;
            color: white;
        }
        .btn-tiktok:hover {
            background: #cc003f;
        }
        .footer {
            margin-top: 20px;
            font-size: 12px;
            color: #56667a;
        }
        .call-action { color: #00e676; text-shadow: 0 0 10px rgba(0,230,118,0.3); }
        .put-action { color: #ff3366; text-shadow: 0 0 10px rgba(255,51,102,0.3); }
    </style>
</head>
<body>

    <div class="container">
        <h1>Somali Pocket Option Signals</h1>
        <p>Ku soo dhowaad madasha rasmiga ah ee calaamadaha pargalka trading-ka.</p>

        <div class="signal-box" id="signalBox">
            <div style="color: #8a99ad; font-size: 13px; font-weight: bold; letter-spacing: 1px;">🟢 TOOS / LIVE SIGNAL</div>
            <div class="signal-display" id="signalContainer">Sugaya nidaamka...</div>
            <div class="countdown-box" id="countdownContainer">Signal-ka xiga: --:--</div>
            <span style="color: #56667a; font-size: 11px; display: block; margin-top: 10px;" id="timeContainer"></span>
        </div>

        <a href="https://www.tiktok.com/@khadar_kuwarizma" target="_blank" class="btn btn-tiktok">Nagala Soco TikTok</a>

        <div class="footer">
            &copy; 2026 ALNUUR STORE & BIID DESIGN. All rights reserved.
        </div>
    </div>

    <script>
        // Suuqyada Pocket Option OTC iyo Solana Tokens oo aad la socoto
        const assets = ["EUR/USD (OTC)", "GBP/USD (OTC)", "USD/JPY (OTC)", "SOL/USDT", "EUR/GBP (OTC)"];
        const directions = ["CALL 🟢", "PUT 🔴"];
        const durations = ["1 MIN", "2 MIN"];
        
        let timeLeft = 60; // Signal kasta wuxuu ogaanayaa 60 ilbiriqsi (1 daqiiqo)
        let timerInterval;

        function generateNewSignal() {
            // Doorasho random ah
            const randomAsset = assets[Math.floor(Math.random() * assets.length)];
            const randomDirection = directions[Math.floor(Math.random() * directions.length)];
            const randomDuration = durations[Math.floor(Math.random() * durations.length)];
            
            const isCall = randomDirection.includes("CALL");
            const actionClass = isCall ? "call-action" : "put-action";
            
            // Beddel midabka darbiga bidix iyadoo loo eegayo Call ama Put
            document.getElementById("signalBox").style.borderLeftColor = isCall ? "#00e676" : "#ff3366";
            
            // Ku shub xogta bogga
            document.getElementById("signalContainer").innerHTML = 
                `${randomAsset} <br> <span class="${actionClass}">${randomDirection}</span> <br> <span style="font-size:16px; color:#8a99ad;">waqti: ${randomDuration}</span>`;
            
            const now = new Date();
            document.getElementById("timeContainer").innerHTML = `La cusboonaysiiyay: ${now.toLocaleTimeString()}`;
            
            // Dib u bilaw waqtiga nidaamka
            timeLeft = 60; 
        }

        function startTimer() {
            timerInterval = setInterval(() => {
                timeLeft--;
                
                let minutes = Math.floor(timeLeft / 60);
                let seconds = timeLeft % 60;
                
                // Ku dar eber haddii ay ka yar tahay 10
                seconds = seconds < 10 ? '0' + seconds : seconds;
                
                document.getElementById("countdownContainer").innerHTML = `Signal-ka xiga: 0${minutes}:${seconds}`;
                
                if (timeLeft <= 0) {
                    generateNewSignal();
                }
            }, 1000);
        }

        // Shid nidaamka marka boggu uu toos u furmo
        window.onload = function() {
            generateNewSignal();
            startTimer();
        };
    </script>

</body>
</html>
