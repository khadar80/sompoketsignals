<html lang="so">

    <style>
        * {
            box-sizing: border-box;

        body {

            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;

            border: 1px solid #1f2d3d;

        h1 {
            font-size: 24px;

        .signal-title {

            margin-bottom: 5px;
        }
        .btn {
            display: block;
            width: 100%;

            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            transition: background 0.3s ease;
        }
