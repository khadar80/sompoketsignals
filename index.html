<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <title>FINAL CHALLENGE - REAL FOREX ENGINE</title>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .dashboard { width: 350px; background: #111; padding: 20px; border-radius: 15px; border: 1px solid #333; text-align: center; }
        .price-display { font-size: 30px; font-weight: bold; color: #00ff00; margin: 20px 0; }
        select { width: 100%; padding: 10px; background: #222; color: #fff; border: 1px solid #444; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>

<div class="dashboard">
    <h2 style="color: #fff;">LIVE FOREX ENGINE</h2>
    
    <select id="pair" onchange="loadEngine()">
        <option value="FX:EURUSD">EUR/USD</option>
        <option value="FX:GBPUSD">GBP/USD</option>
        <option value="FX:USDJPY">USD/JPY</option>
        <option value="FX:AUDUSD">AUD/USD</option>
        <option value="FX:USDCAD">USD/CAD</option>
        <option value="FX:NZDUSD">NZD/USD</option>
    </select>

    <div id="price-container">
        <div id="price" class="price-display">Connecting...</div>
    </div>
    
    <div id="signal" style="font-size: 20px; font-weight: bold;">ANALYZING</div>
</div>

<script type="text/javascript" src="https://s3.tradingview.com/external-embedding/latest/embed-widget-single-quote.js" id="tv-widget-script"></script>

<script>
    function loadEngine() {
        const pair = document.getElementById("pair").value;
        const container = document.getElementById("price-container");
        container.innerHTML = `<div id="tradingview-widget-container"></div>`;
        
        new window.TradingView.widget({
            "symbol": pair,
            "width": 300,
            "height": 100,
            "container_id": "tradingview-widget-container",
            "theme": "dark",
            "locale": "en",
            "toolbar_bg": "#f1f3f6",
            "enable_publishing": false,
            "withdateranges": true,
            "hide_side_toolbar": true
        });
        
        // Signal logic ku salaysan isbeddelka dhabta ah
        document.getElementById("signal").innerText = "MONITORING...";
    }
    
    // Bilow engine-ka
    window.onload = loadEngine;
</script>
</body>
</html>
