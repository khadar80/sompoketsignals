<body>
    <div id="root"></div>

    <script type="text/babel">
        const {useState, useEffect, useRef} = React;

        // ── OTC ASSETS ──
        const OTC_ASSETS=[
            {symbol:"EUR/USD",id:"EURUSD_otc",base:1.085,type:"otc"},
            {symbol:"GBP/USD",id:"GBPUSD_otc",base:1.265,type:"otc"},
            {symbol:"USD/JPY",id:"USDJPY_otc",base:155.4,type:"otc"},
            {symbol:"AUD/USD",id:"AUDUSD_otc",base:0.645,type:"otc"},
            {symbol:"EUR/GBP",id:"EURGBP_otc",base:0.857,type:"otc"},
            {symbol:"USD/CAD",id:"USDCAD_otc",base:1.365,type:"otc"},
            {symbol:"USD/CHF",id:"USDCHF_otc",base:0.902,type:"otc"},
            {symbol:"NZD/USD",id:"NZDUSD_otc",base:0.595,type:"otc"},
            {symbol:"EUR/JPY",id:"EURJPY_otc",base:168.5,type:"otc"},
            {symbol:"GBP/JPY",id:"GBPJPY_otc",base:196.2,type:"otc"},
        ];

        // ── NON-OTC (FOREX) ASSETS ──
        const FOREX_ASSETS=[
            {symbol:"EUR/USD",id:"EURUSD",base:1.085,type:"forex"},
            {symbol:"GBP/USD",id:"GBPUSD",base:1.265,type:"forex"},
            {symbol:"USD/JPY",id:"USDJPY",base:155.4,type:"forex"},
            {symbol:"AUD/USD",id:"AUDUSD",base:0.645,type:"forex"},
            {symbol:"USD/CAD",id:"USDCAD",base:1.365,type:"forex"},
            {symbol:"USD/CHF",id:"USDCHF",base:0.902,type:"forex"},
            {symbol:"EUR/JPY",id:"EURJPY",base:168.5,type:"forex"},
            {symbol:"GBP/JPY",id:"GBPJPY",base:196.2,type:"forex"},
            {symbol:"EUR/GBP",id:"EURGBP",base:0.857,type:"forex"},
            {symbol:"AUD/JPY",id:"AUDJPY",base:100.2,type:"forex"},
        ];

        const TFS=["30s","1m","2m","5m","15m"];
        const TF_SEC={"30s":30,"1m":60,"2m":120,"5m":300,"15m":900};
        const FINNHUB_KEY="d7rpt1hr01qm28g78f90";

        const FH_SYMBOL={
            "EUR/USD":"OANDA:EUR_USD", "GBP/USD":"OANDA:GBP_USD", "USD/JPY":"OANDA:USD_JPY",
            "AUD/USD":"OANDA:AUD_USD", "USD/CAD":"OANDA:USD_CAD", "USD/CHF":"OANDA:USD_CHF",
            "EUR/JPY":"OANDA:EUR_JPY", "GBP/JPY":"OANDA:GBP_JPY", "EUR/GBP":"OANDA:EUR_GBP",
            "AUD/JPY":"OANDA:AUD_JPY"
        };

        function getForexStatus(){
            const now=new Date(); const utcDay=now.getUTCDay(); const utcH=now.getUTCHours(); const utcM=now.getUTCMinutes();
            const utcTotal=utcH*60+utcM;
            const isWeekend=(utcDay===6&&utcTotal>=21*60)||(utcDay===0&&utcTotal<22*60);
            if(isWeekend){
                let minsToOpen = utcDay===6 ? (24*60-utcTotal+21*60)+(24*60) : (22*60)-utcTotal;
                const h=Math.floor(Math.abs(minsToOpen)/60),m=Math.abs(minsToOpen)%60;
                return{open:false,session:"XIDHAN",reason:`Weekend · ${h}h ${m}m gudahood`,color:"#ff4d6a"};
            }
            const sessions=[];
            if(utcTotal>=0&&utcTotal<9*60)sessions.push("Tokyo");
            if(utcTotal>=21*60||utcTotal<6*60)sessions.push("Sydney");
            if(utcTotal>=7*60&&utcTotal<16*60)sessions.push("London");
            if(utcTotal>=12*60&&utcTotal<21*60)sessions.push("New York");
            const isOverlap=utcTotal>=12*60&&utcTotal<16*60;
            if(sessions.length===0||(sessions.length===1&&sessions[0]==="Sydney")){
                return{open:true,session:"LOW LIQUIDITY",reason:"Sydney only · Signals weak",color:"#ffd60a",quality:"low"};
            }
            return{open:true,session:sessions.join(" + "),reason:isOverlap?"Overlap · Best signals":"Active session",color:isOverlap?"#00ff88":"#00b4d8",quality:isOverlap?"best":"good"};
        }

        function poURL(asset){ return `https://pocketoption.com/en/cabinet/demo-quick-high-low/?asset=${asset.id}`; }
        function genPrice(p){return parseFloat((p+(Math.random()-0.495)*p*0.002).toFixed(5));}

        async function fetchRealPrice(symbol){
            try{
                const fhSym=FH_SYMBOL[symbol]; if(!fhSym)return null;
                const r=await fetch(`https://finnhub.io/api/v1/quote?symbol=${encodeURIComponent(fhSym)}&token=${FINNHUB_KEY}`);
                const d=await r.json(); if(d&&d.c&&d.c>0)return parseFloat(d.c); return null;
            }catch(e){return null;}
        }

        async function fetchCandles(symbol,resolution){
            try{
                const fhSym=FH_SYMBOL[symbol]; if(!fhSym)return null;
                const to=Math.floor(Date.now()/1000);
                const resMap={"30s":"1","1m":"1","2m":"5","5m":"5","15m":"15"};
                const res=resMap[resolution]||"1";
                const from=to-(40*parseInt(res)*60);
                const r=await fetch(`https://finnhub.io/api/v1/forex/candle?symbol=${encodeURIComponent(fhSym)}&resolution=${res}&from=${from}&to=${to}&token=${FINNHUB_KEY}`);
                const d=await r.json(); if(d&&d.s==="ok"&&d.c&&d.c.length>=10)return d.c.slice(-40); return null;
            }catch(e){return null;}
        }

        function analyze(hist){
            const p=hist&&hist.length>=10?hist:Array.from({length:14},(_,i)=>1+i*0.001); const n=p.length;let g=0,l=0;
            for(let i=1;i<n;i++){const d=p[i]-p[i-1];d>0?g+=d:l+=Math.abs(d);}
            const rsi=100-100/(1+(g/n)/((l/n)||0.0001));
            const ema=(arr,k)=>arr.slice(-k).reduce((a,b,i)=>i===0?b:a*(1-2/(k+1))+b*(2/(k+1)),arr[0]);
            const e5=ema(p,5),e14=ema(p,14);
            const mean=p.reduce((a,b)=>a+b,0)/n; const std=Math.sqrt(p.reduce((a,b)=>a+Math.pow(b-mean,2),0)/n);
            const last=p[n-1]; let up=0,dn=0;
            if(rsi<32)up+=3;else if(rsi<45)up+=1; if(rsi>68)dn+=3;else if(rsi>55)dn+=1;
            if(e5>e14)up+=2;else dn+=2; if(last<=mean-2*std)up+=3;else if(last>=mean+2*std)dn+=3;
            const dir=up>=dn?"UP":"DOWN"; const score=Math.max(up,dn); const conf=Math.min(94,Math.floor(72+score*2.5));
            let strat="Multi-Indicator";
            if(rsi<32||rsi>68)strat="RSI Extreme Zone"; else if(last<=mean-2*std||last>=mean+2*std)strat="Bollinger Reversal";
            else if(Math.abs(e5-e14)>std*0.3)strat="EMA Trend Cross"; else if(up>dn+1)strat="Bullish Confluence";
            else if(dn>up+1)strat="Bearish Confluence"; else strat="S/R Bounce";
            return{dir,conf,strat};
        }

        function analyzeOTC(hist){ const base=analyze(hist); base.conf=Math.min(94,base.conf+Math.floor(Math.random()*6)); return base; }

        function playBeep(up){
            try{
                const ctx=new(window.AudioContext||window.webkitAudioContext)(); const osc=ctx.createOscillator(),gain=ctx.createGain();
                osc.connect(gain);gain.connect(ctx.destination); osc.frequency.value=up?880:440;osc.type="sine";
                gain.gain.setValueAtTime(0.3,ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.5);
                osc.start();osc.stop(ctx.currentTime+0.5);
            }catch(e){}
        }

        function MiniChart({data,color}){
            const W=68,H=30; if(!data||data.length<2)return <svg width={W} height={H}/>;
            const min=Math.min(...data),max=Math.max(...data),range=max-min||0.0001; const bw=Math.max(2,W/data.length-0.8);
            const bars=data.map((v,i)=>{
                const pv=i>0?data[i-1]:v,isUp=v>=pv; const x=(i/(data.length-1))*(W-bw);
                const yh=H-((Math.max(v,pv)-min)/range)*(H-4)-2; const yl=H-((Math.min(v,pv)-min)/range)*(H-4)-2;
                return <rect key={i} x={x} y={yh} width={bw} height={Math.max(2,yl-yh)} fill={isUp?"#00ff88":"#ff4d6a"} opacity={0.8} rx={0.5}/>;
            });
            const pts=data.map((v,i)=>`${(i/(data.length-1))*W},${H-((v-min)/range)*(H-4)-2}`).join(" ");
            return <svg width={W} height={H}>{bars}<polyline points={pts} fill="none" stroke={color} strokeWidth="1" opacity="0.5"/></svg>;
        }

        function SyncRing({tf,startTime}){
            const [now,setNow]=useState(Date.now());
            useEffect(()=>{ const t=setInterval(()=>setNow(Date.now()),200); return()=>clearInterval(t); },[]);
            const tfSec=TF_SEC[tf]||60; const elapsed=Math.floor((now-startTime)/1000); const remaining=Math.max(0, tfSec-((elapsed)%tfSec)); const pct=remaining/tfSec;
            const r=18,c=2*Math.PI*r; const col=pct>0.5?"#00ff88":pct>0.25?"#ffd60a":"#ff4d6a"; const urgent=remaining<=5;
            return(
                <svg width={44} height={44}>
                    <circle cx={22} cy={22} r={r} fill="none" stroke="rgba(255,255,255,0.07)" strokeWidth={3}/>
                    <circle cx={22} cy={22} r={r} fill="none" stroke={col} strokeWidth={3} strokeDasharray={c} strokeDashoffset={c*(1-pct)} strokeLinecap="round" transform="rotate(-90 22 22)" style={{transition:"stroke-dashoffset 0.2s linear"}}/>
                    <text x={22} y={26} textAnchor="middle" fill={col} fontSize={11} fontWeight="bold" fontFamily="monospace" style={{animation:urgent?"blink 0.5s infinite":"none"}}>{remaining}</text>
                </svg>
            );
        }

        function StrBadge({conf}){
            if(conf>=88)return <span style={{display:"inline-flex",padding:"4px 10px",borderRadius:6,background:"rgba(255,214,10,0.18)",color:"#ffd60a",border:"1px solid rgba(255,214,10,0.4)",fontSize:11,fontWeight:800}}>XOOGGAN {conf}%</span>;
            if(conf>=80)return <span style={{display:"inline-flex",padding:"4px 10px",borderRadius:6,background:"rgba(0,255,136,0.13)",color:"#00ff88",border:"1px solid rgba(0,255,136,0.3)",fontSize:11,fontWeight:800}}>FIICAN {conf}%</span>;
            return <span style={{display:"inline-flex",padding:"4px 10px",borderRadius:6,background:"rgba(255,255,255,0.06)",color:"#aaa",border:"1px solid rgba(255,255,255,0.12)",fontSize:11,fontWeight:800}}>CAADI {conf}%</span>;
        }

        function App(){
            const [dark,setDark]=useState(true); const [tab,setTab]=useState("signals"); const [panel,setPanel]=useState("markets"); const [mode,setMode]=useState("otc");
            const ASSETS=mode==="otc"?OTC_ASSETS:FOREX_ASSETS;
            const [prices,setPrices]=useState(()=>Object.fromEntries([...OTC_ASSETS,...FOREX_ASSETS].map(a=>[a.symbol+a.type,a.base])));
            const [hist,setHist]=useState(()=>Object.fromEntries([...OTC_ASSETS,...FOREX_ASSETS].map(a=>[a.symbol+a.type,[]])));
            const [signals,setSignals]=useState([]); const [allHist,setAllHist]=useState([]); const [selAsset,setSelAsset]=useState(OTC_ASSETS[0]);
            const [selTF,setSelTF]=useState("1m"); const [scanning,setScanning]=useState(false); const [onlyMe,setOnlyMe]=useState(false);
            const [soundOn,setSoundOn]=useState(true); const [autoOpen,setAutoOpen]=useState(true); const [stats,setStats]=useState({total:0,wins:0,losses:0});
            const [notif,setNotif]=useState(null); const [mgBase,setMgBase]=useState(10); const [mgMul,setMgMul]=useState(2.1); const [mgLoss,setMgLoss]=useState(0);
            const [forexStatus,setForexStatus]=useState(getForexStatus());
            const [apiStatus,setApiStatus]=useState("connecting"); // FIXED: Removed duplicate declaration

            useEffect(()=>{ setForexStatus(getForexStatus()); const t=setInterval(()=>setForexStatus(getForexStatus()),30000); return()=>clearInterval(t); },[]);

            useEffect(()=>{
                async function fetchAll(){
                    try{
                        const results={};
                        for(const a of FOREX_ASSETS){
                            const p=await fetchRealPrice(a.symbol); if(p)results[a.symbol+"forex"]=p;
                            await new Promise(r=>setTimeout(r,120));
                        }
                        if(Object.keys(results).length>0){
                            setPrices(prev=>({...prev,...results}));
                            setHist(h=>{
                                const n={...h};
                                Object.entries(results).forEach(([key,val])=>{ const arr=[...(h[key]||[]),val]; n[key]=arr.length>40?arr.slice(-40):arr; });
                                return n;
                            });
                            setApiStatus("live");
                        }
                    }catch(e){setApiStatus("error");}
                }
                fetchAll(); const t=setInterval(fetchAll,10000); return()=>clearInterval(t);
            },[]);

            const pricesRef=useRef(prices); const histRef=useRef(hist);
            useEffect(()=>{pricesRef.current=prices;},[prices]); useEffect(()=>{histRef.current=hist;},[hist]);

            useEffect(()=>{ const newAssets=mode==="otc"?OTC_ASSETS:FOREX_ASSETS; const found=newAssets.find(a=>a.symbol===selAsset.symbol); setSelAsset(found||newAssets[0]); },[mode]);

            useEffect(()=>{
                const timer=setInterval(()=>{
                    setPrices(p=>{ const n={...p}; OTC_ASSETS.forEach(a=>{n[a.symbol+a.type]=genPrice(p[a.symbol+a.type]||a.base);}); return n; });
                    setHist(h=>{ const n={...h}; OTC_ASSETS.forEach(a=>{ const key=a.symbol+a.type; const arr=[...(h[key]||[]),pricesRef.current[key]||a.base]; n[key]=arr.length>40?arr.slice(-40):arr; }); return n; });
                },1200);
                return()=>clearInterval(timer);
            },[]);

            useEffect(()=>{
                let scanTimer;
                if(scanning){
                    scanTimer=setInterval(async()=>{
                        const pool=onlyMe?[selAsset]:ASSETS; const asset=pool[Math.floor(Math.random()*pool.length)];
                        if(asset.type==="forex"&&!forexStatus.open) return;
                        const isLowQual=asset.type==="forex"&&forexStatus.quality==="low";
                        let candleData=null; let isRealSignal=false;
                        if(asset.type==="forex"){
                            setApiStatus("loading"); candleData=await fetchCandles(asset.symbol,selTF);
                            if(candleData&&candleData.length>=10){ isRealSignal=true; setApiStatus("ok"); setHist(h=>({...h,[asset.symbol+"forex"]:candleData})); }
                            else { setApiStatus("error"); }
                        }
                        if(!candleData){ const key=asset.symbol+asset.type; candleData=histRef.current[key]||[]; }
                        const{dir,conf,strat}=asset.type==="forex"&&isRealSignal ? analyze(candleData) : analyzeOTC(candleData);
                        const tfSec=TF_SEC[selTF]||60; const nowMs=Date.now(); const candleStart=Math.floor(nowMs/(tfSec*1000))*(tfSec*1000);
                        const sig={ id:nowMs+Math.random(), asset:asset.symbol, assetId:asset.id, assetType:asset.type, assetObj:asset, dir,conf,strat,tf:selTF, time:new Date().toLocaleTimeString(), startTime:candleStart, lowQual:isLowQual||false, isReal:isRealSignal, result:null };
                        setSignals(s=>[sig,...s].slice(0,30)); setAllHist(s=>[sig,...s].slice(0,200)); setStats(s=>({...s,total:s.total+1})); setNotif(sig); setPanel("signals");
                        if(soundOn)playBeep(dir==="UP"); if(autoOpen) setTimeout(()=>window.open(poURL(asset),"_blank"),400);
                        setTimeout(()=>setNotif(n=>n&&n.id===sig.id?null:n),5000);
                        const msLeft=(candleStart+tfSec*1000)-nowMs;
                        setTimeout(()=>{
                            if(!isRealSignal){
                                const won=Math.random()<0.5+(conf-70)*0.018; const result=won?"WIN":"LOSS";
                                setSignals(s=>s.map(x=>x.id===sig.id?{...x,result}:x)); setAllHist(s=>s.map(x=>x.id===sig.id?{...x,result}:x));
                                setStats(s=>({...s,wins:s.wins+(won?1:0),losses:s.losses+(won?0:1)})); playBeep(won);
                            }
                        },Math.max(msLeft,3000));
                    },8000);
                }
                return()=>clearInterval(scanTimer);
            },[scanning,selTF,onlyMe,selAsset,soundOn,autoOpen,ASSETS,forexStatus]);

            const wr=(stats.wins+stats.losses)>0?Math.round(stats.wins/(stats.wins+stats.losses)*100):0;
            const mgSteps=Array.from({length:6},(_,i)=>({n:i+1,amt:parseFloat((mgBase*Math.pow(mgMul,i)).toFixed(2)),risk:parseFloat((mgBase*(Math.pow(mgMul,i+1)-1)/(mgMul-1)).toFixed(2))}));
            const pending=signals.filter(s=>!s.result).length;
            const bg=dark?"#080d14":"#f0f4f8"; const card=dark?"rgba(255,255,255,0.035)":"rgba(0,0,0,0.05)"; const bdr=dark?"rgba(255,255,255,0.08)":"rgba(0,0,0,0.12)";
            const txt=dark?"#e8f0fe":"#0d1a2e"; const sub=dark?"rgba(255,255,255,0.4)":"rgba(0,0,0,0.4)"; const ac="#00ff88";
            const inp={background:dark?"#0d1520":"#e8eef4",border:`1px solid ${bdr}`,color:txt,borderRadius:7,padding:"7px 9px",fontSize:12,width:"100%"};

            return(
                <div style={{minHeight:"100vh",background:bg,color:txt,fontFamily:"'Courier New',monospace",overflowX:"hidden",position:"relative"}}>
                    <div style={{position:"fixed",inset:0,zIndex:0,backgroundImage:"linear-gradient(rgba(0,200,100,0.02) 1px,transparent 1px),linear-gradient(90deg,rgba(0,200,100,0.02) 1px,transparent 1px)",backgroundSize:"40px 40px",pointerEvents:"none"}}/>
                    
                    {notif&&(
                        <div style={{position:"fixed",top:14,right:14,zIndex:9999,background:notif.dir==="UP"?"rgba(0,200,80,0.2)":"rgba(255,50,70,0.2)",border:`2px solid ${notif.dir==="UP"?"#00ff88":"#ff4d6a"}`,borderRadius:14,padding:"12px 16px",backdropFilter:"blur(20px)",animation:"sIn 0.3s ease",minWidth:240,boxShadow:`0 0 30px ${notif.dir==="UP"?"rgba(0,255,136,0.3)":"rgba(255,77,106,0.3)"}`}}>
                            <div style={{fontSize:9,opacity:0.6,marginBottom:3,letterSpacing:1}}>SIGNAL CUSUB {notif.assetType==="otc"?"· OTC":"· FOREX"}</div>
                            <div style={{fontSize:18,fontWeight:900,color:notif.dir==="UP"?"#00ff88":"#ff4d6a",marginBottom:3}}>{notif.dir==="UP"?"BUY":"SELL"} — {notif.asset}</div>
                            <div style={{fontSize:10,opacity:0.7}}>{notif.strat} · {notif.tf} · {notif.conf}%</div>
                            {autoOpen&&<div style={{fontSize:9,color:"#00cfff",marginTop:5,opacity:0.8}}>PocketOption si toos ah u furmayaa...</div>}
                        </div>
                    )}

                    <div style={{position:"relative",zIndex:1,maxWidth:620,margin:"0 auto",padding:"12px 10px"}}>
                        {/* HEADER */}
                        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:12}}>
                            <div style={{display:"flex",alignItems:"center",gap:9}}>
