<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signals · Somali Pocket Option</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #080d14;
            color: #e8f0fe;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 500px;
            width: 100%;
            background: #111a24;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            text-align: center;
            border: 1px solid #1f2d3d;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 10px;
            color: #00e676;
        }
        p {
            color: #8a99ad;
            font-size: 14px;
            margin-bottom: 25px;
        }
        .signal-box {
            background: #1b2735;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 25px;
            border-left: 5px solid #00e676;
        }
        .signal-display {
            font-size: 22px;
            font-weight: bold;
            margin: 15px 0;
            letter-spacing: 1px;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            transition: background 0.3s ease;
        }
        .btn-primary {
            background: #00e676;
            color: #080d14;
        }
        .btn-primary:hover {
            background: #00b354;
        }
        .btn-tiktok {
            background: #ff0050;
            color: white;
        }
        .btn-tiktok:hover {
            background: #cc003f;
        }
        .footer {
            margin-top: 20px;
            font-size: 12px;
            color: #56667a;
        }
        .call-action { color: #00e676; }
        .put-action { color: #ff3366; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Somali Pocket Option Signals</h1>
        <p>Ku soo dhowaad madasha rasmiga ah ee calaamadaha pargalka trading-ka.</p>

        <div class="signal-box">
            <div style="color: #8a99ad; font-size: 14px; font-weight: bold;">🟢 SIGNAL-KA HADDA JOOGA</div>
            <div class="signal-display" id="signalContainer">Sugaya Signal-ka...</div>
            <span style="color: #8a99ad; font-size: 12px;" id="timeContainer">Cusboonaysiinta: 00:00</span>
        </div>

        <button class="btn btn-primary" onclick="generateManualSignal()">Abuur Signal Cusub</button>
        <a href="https://www.tiktok.com/@khadar_kuwarizma" target="_blank" class="btn btn-tiktok">Nagala Soco TikTok</a>

        <div class="footer">
            &copy; 2026 ALNUUR STORE & BIID DESIGN. All rights reserved.
        </div>
    </div>

    <script>
        const pairs = ["EUR/USD (OTC)", "GBP/USD (OTC)", "AUD/USD (OTC)", "USD/JPY (OTC)", "EUR/GBP (OTC)"];
        const actions = ["CALL 🟢", "PUT 🔴"];
        const times = ["1 MIN", "2 MIN", "5 MIN"];

        function generateManualSignal() {
            const randomPair = pairs[Math.floor(Math.random() * pairs.length)];
            const randomAction = actions[Math.floor(Math.random() * actions.length)];
            const randomTime = times[Math.floor(Math.random() * times.length)];
            
            const actionClass = randomAction.includes("CALL") ? "call-action" : "put-action";
            
            document.getElementById("signalContainer").innerHTML = 
                `${randomPair} <br> <span class="${actionClass}">${randomAction}</span> [${randomTime}]`;
            
            const now = new Date();
            document.getElementById("timeContainer").innerHTML = `La cusboonaysiiyay: ${now.toLocaleTimeString()}`;
        }

        // Si toos ah u bilaw signal-ka ugu horreeya marka boggu furmo
        window.onload = function() {
            generateManualSignal();
        };
    </script>

</body>
</html>
