<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signals · Somali Pocket Option</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #080d14;
            color: #e8f0fe;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 500px;
            width: 100%;
            background: #111a24;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            text-align: center;
            border: 1px solid #1f2d3d;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 10px;
            color: #00e676;
        }
        .motivation-text {
            color: #00e676;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 20px;
            line-height: 1.5;
        }
        .selector-box {
            margin-bottom: 15px;
            background: #1b2735;
            padding: 12px;
            border-radius: 8px;
            text-align: left;
        }
        .selector-box label {
            font-size: 11px;
            color: #8a99ad;
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
            letter-spacing: 0.5px;
        }
        .select-input {
            width: 100%;
            padding: 10px;
            background: #111a24;
            border: 1px solid #1f2d3d;
            border-radius: 6px;
            color: #ffffff;
            font-size: 15px;
            font-weight: bold;
            outline: none;
            cursor: pointer;
        }
        .widget-wrapper {
            background: #1b2735;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            border: 1px solid #263238;
            min-height: 440px;
        }
        /* Qaybta casharrada tooska ah */
        .lesson-box {
            background: #1b2735;
            padding: 18px;
            border-radius: 10px;
            margin-bottom: 20px;
            border-left: 4px solid #ff9800;
            text-align: left;
            min-height: 120px;
            transition: all 0.5s ease-in-out;
        }
        .lesson-title {
            font-size: 14px;
            color: #ff9800;
            font-weight: bold;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .lesson-content {
            font-size: 13px;
            color: #b0bec5;
            line-height: 1.6;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            transition: background 0.3s ease;
            text-align: center;
        }
        .btn-tiktok {
            background: #ff0050;
            color: white;
        }
        .btn-tiktok:hover {
            background: #cc003f;
        }
        .footer {
            margin-top: 15px;
            font-size: 12px;
            color: #56667a;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Somali Pocket Option</h1>
        <div class="motivation-text">"Guushu kuma timaaddo dhalanteed, waxay ku dhalataa go'aan adag, samir iyo edbin ganacsi. Maareey maalkaaga!"</div>

        <div class="selector-box">
            <label>DOORO LACAGTA AAD RABTO (ASSET)</label>
            <select class="select-input" id="assetSelector" onchange="changeLiveAsset()">
                <optgroup label="Major Pairs (Kuwa ugu waaweyn)">
                    <option value="FX:EURUSD">EUR/USD</option>
                    <option value="FX:GBPUSD">GBP/USD</option>
                    <option value="FX:USDJPY">USD/JPY</option>
                    <option value="FX:AUDUSD">AUD/USD</option>
                    <option value="FX:USDCAD">USD/CAD</option>
                    <option value="FX:USDCHF">USD/CHF</option>
                    <option value="FX:NZDUSD">NZD/USD</option>
                </optgroup>
                <optgroup label="Euro Crosses">
                    <option value="FX:EURGBP">EUR/GBP</option>
                    <option value="FX:EURJPY">EUR/JPY</option>
                    <option value="FX:EURAUD">EUR/AUD</option>
                    <option value="FX:EURCAD">EUR/CAD</option>
                    <option value="FX:EURCHF">EUR/CHF</option>
                    <option value="FX:EURNZD">EUR/NZD</option>
                </optgroup>
                <optgroup label="GBP Crosses">
                    <option value="FX:GBPJPY">GBP/JPY</option>
                    <option value="FX:GBPAUD">GBP/AUD</option>
                    <option value="FX:GBPCAD">GBP/CAD</option>
                    <option value="FX:GBPCHF">GBP/CHF</option>
                    <option value="FX:GBPNZD">GBP/NZD</option>
                </optgroup>
                <optgroup label="Other Minor Pairs">
                    <option value="FX:AUDJPY">AUD/JPY</option>
                    <option value="FX:AUDCAD">AUD/CAD</option>
                    <option value="FX:AUDCHF">AUD/CHF</option>
                    <option value="FX:AUDNZD">AUD/NZD</option>
                    <option value="FX:CADJPY">CAD/JPY</option>
                    <option value="FX:CADCHF">CAD/CHF</option>
                    <option value="FX:CHFJPY">CHF/JPY</option>
                    <option value="FX:NZDJPY">NZD/JPY</option>
                    <option value="FX:NZDCAD">NZD/CAD</option>
                    <option value="FX:NZDCHF">NZD/CHF</option>
                </optgroup>
            </select>
        </div>

        <div class="widget-wrapper" id="widgetContainer"></div>

        <div class="lesson-box">
            <div class="lesson-title" id="lessonTitle">📚 CASHARKA MAANTA: Sugaya...</div>
            <div class="lesson-content" id="lessonContent">Xogta casharrada ayaa hadda xisaabtamaysa...</div>
        </div>

        <a href="https://www.tiktok.com/@khadar_kuwarizma" target="_blank" class="btn btn-tiktok">Nagala Soco TikTok</a>

        <div class="footer">
            &copy; 2026 ALNUUR STORE & BIID DESIGN.
        </div>
    </div>

    <script>
        // Liiska casharrada maaliyadeed ee qofka u soo baxaya si toos ah
        const tradingLessons = [
            {
                title: "📚 XEERKA RISK MANAGEMENT (1%)",
                content: "Waligaa hal trade ha u isticmaalin wax ka badan 1% ilaa 2% oo kamid ah lacagta kuugu jirta akaount-kaaga. Tani waxay kaa caawinaysaa inaad suuqa sii joogto xataa haddii aad dhowr jeer khasaarto."
            },
            {
                title: "🕯️ CODKA CANDLESTICK PATTERNS",
                content: "Markaad aragto shumaca 'Hammer' ama 'Pin Bar' oo ku dhuftay aagga Support-ka, waxay muujinaysaa in iibsadayaashu (Buyers) suuqa soo galeen, nidaamkuna uu u dhow yahay iib kor u kac ah (BUY)."
            },
            {
                title: "📉 KELIYA RAAC TREND-KA SUUQA",
                content: "Xikmadda suuqa waxay leedahay: 'The trend is your friend'. Haddii suuqu yahay Uptrend, kaliya raadi fursado BUY ah. Ha isku dayin inaad ka hor ttagto jiho xooggan oo suuqu u socdo."
            },
            {
                title: "🧠 EDXIBTA GANACSIGA (TRADING DISCIPLINE)",
                content: "Khasaaruhu waa qayb kamid ah ganacsiga. Haddii aad lumiso 3 trade oo isku xiga maanta, dami kombiyuutarka ama moobilka. Ha isku dayin inaad aargudato (Revenge Trading) waayo waxaad lumin doontaa lacag kale."
            },
            {
                title: "📊 MAREEYA TRADING PLAN-KAAGA",
                content: "Kahor inta uusan suuqu furmin, deji inta dollar oo aad rabto inaad faa'iido ahaan u samayso (Take Profit) iyo inta aad u dulqaadan karto khasaare ahaan (Stop Loss). Markaad hadafkaga gaarto, ka bax suuqa."
            }
        ];

        let currentLessonIndex = 0;

        function rotateLessons() {
            const titleElement = document.getElementById("lessonTitle");
            const contentElement = document.getElementById("lessonContent");
            
            // Ku shubista casharka xiga
            const currentLesson = tradingLessons[currentLessonIndex];
            titleElement.innerText = currentLesson.title;
            contentElement.innerText = currentLesson.content;

            // Isku wareejinta index-ka
            currentLessonIndex = (currentLessonIndex + 1) % tradingLessons.length;
        }

        function loadTradingViewWidget(symbol) {
            const container = document.getElementById("widgetContainer");
            container.innerHTML = ""; 

            const widgetScript = document.createElement("script");
            widgetScript.type = "text/javascript";
            widgetScript.src = "https://s3.tradingview.com/external-embedding/embed-widget-technical-analysis.js";
            widgetScript.async = true;

            const widgetConfig = {
                "interval": "1m",
                "width": "100%",
                "isTransparent": true,
                "height": 440,
                "symbol": symbol,
                "showIntervalTabs": true,
                "displayMode": "single",
                "locale": "en",
                "colorTheme": "dark"
            };

            widgetScript.innerHTML = JSON.stringify(widgetConfig);
            container.appendChild(widgetScript);
        }

        function changeLiveAsset() {
            const selectedSymbol = document.getElementById("assetSelector").value;
            loadTradingViewWidget(selectedSymbol);
        }

        window.onload = function() {
            loadTradingViewWidget("FX:EURUSD");
            rotateLessons(); // Soo saar casharkii ugu horeeyey
            setInterval(rotateLessons, 20000); // 20-kii ilbiriqsiba mar isbeddel automatic ah
        };
    </script>

</body>
</html>
